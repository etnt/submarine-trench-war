name: Build container image

# Build and publish a Podman image to the GitHub Container Registry (GHCR)
# whenever a version tag is pushed, e.g. `git tag v0.1.0 && git push --tags`.
on:
  push:
    tags:
      - "v*"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Erlang/OTP and rebar3
        uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          rebar3-version: "3.24.0"

      - name: Run the test suite
        run: rebar3 eunit

  meta:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Compute image name and tag
        id: meta
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          version="${GITHUB_REF_NAME}"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

  build:
    needs: [test, meta]
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
            platform: linux/amd64
          # GitHub provides standard ARM64 runners for public repositories.
          - runner: ubuntu-24.04-arm
            arch: arm64
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install --yes podman
          podman --version

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | podman login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push ${{ matrix.platform }} image
        run: |
          image="${{ needs.meta.outputs.image }}"
          version="${{ needs.meta.outputs.version }}"
          arch="${{ matrix.arch }}"
          platform="${{ matrix.platform }}"
          tag="${image}:${version}-${arch}"
          podman build --platform "$platform" --tag "$tag" .
          podman push "$tag"

  publish:
    needs: [meta, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install --yes podman
          podman --version

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | podman login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Publish version and latest manifests
        run: |
          image="${{ needs.meta.outputs.image }}"
          version="${{ needs.meta.outputs.version }}"
          manifest="${image}:${version}"
          podman manifest create "$manifest"
          podman manifest add "$manifest" \
            "docker://${image}:${version}-amd64"
          podman manifest add "$manifest" \
            "docker://${image}:${version}-arm64"
          podman manifest push --all \
            "$manifest" "docker://${image}:${version}"
          podman manifest push --all \
            "$manifest" "docker://${image}:latest"
