      const scaleY = el.canvas.height / rect.height;
      const mx = (ev.clientX - rect.left) * scaleX;
      const my = (ev.clientY - rect.top) * scaleY;
      const { ox, oy, size, width, height } = boardMetrics;
      const cx = Math.floor((mx - ox) / size);
      const cy = Math.floor((my - oy) / size);
      if (cx < 0 || cy < 0 || cx >= width || cy >= height) return null;
      return { x: cx, y: cy };
    }

    function tipForCell(cell) {
      const sub = (state.subs || []).find((s) => s.x === cell.x && s.y === cell.y);
      if (sub) {
        const name = (sub.display_name || "Submarine") +
          (sub.player_id === state.playerId ? " (you)" : "");
        if (sub.alive === false) {
          return { title: name, sub: "Wreck \u2014 destroyed." };
        }
        const bits = [];
        if (typeof sub.hull === "number") bits.push("Hull " + sub.hull);
        if (sub.depth) bits.push(sub.depth === "deep" ? "Deep" : "Shallow");
        if (sub.facing) bits.push("Facing " + (FACING_NAME[sub.facing] || sub.facing));
        return { title: name, sub: bits.join(" \u00b7 ") };
      }
      const b = state.board;
      const row = b.grid[cell.y] || "";
      const ch = row[cell.x] || "#";
      return FEATURE_TIP[ch] || null;
    }

    function showMapTip(ev) {
      const cell = cellFromEvent(ev);
      const tip = cell ? tipForCell(cell) : null;
      if (!tip) { el.mapTip.classList.add("hidden"); return; }
      el.mapTip.innerHTML =
        `<div class="tip-title">${tip.title}</div>` +
        (tip.sub ? `<div class="tip-sub">${tip.sub}</div>` : "");
      el.mapTip.classList.remove("hidden");
      el.mapTip.style.left = (ev.clientX + 14) + "px";
      el.mapTip.style.top = (ev.clientY + 14) + "px";
    }

    el.canvas.addEventListener("mousemove", showMapTip);
    el.canvas.addEventListener("mouseleave", () => el.mapTip.classList.add("hidden"));

    // --- help window ----------------------------------------------------
    const CARD_HELP = [
      ["ahead_standard", "Move forward 1 tile along your current heading."],
      ["ahead_flank", "Move forward 2 tiles \u2014 fast, but hard to stop."],
      ["reverse", "Move backward 1 tile without turning."],
      ["port_bank", "Rotate 90\u00b0 to port (left). No movement."],
      ["starboard_bank", "Rotate 90\u00b0 to starboard (right). No movement."],
      ["dive", "Go deep. Deep subs dodge torpedoes, but not depth charges."],
      ["surface", "Rise to shallow depth."],
      ["torpedo", "Fire straight ahead (2 damage). Only hits enemies at your depth; stops at walls."],
      ["depth_charge", "Arm a charge that detonates next register on your tile (3 damage), hitting any depth."],
      ["sonar_ping", "Ping straight ahead (1 damage). Hits any depth and reveals a struck enemy's cards."],
      ["ink_cloud", "Release ink on your tile. It blocks vision through that tile for 2 rounds \u2014 great cover."],
      ["decoy_torpedo", "Fire a phantom torpedo. It leaves a false contact ahead that shows on enemy scopes next round."],
      ["emp_burst", "Fry an adjacent enemy's nav-computer, scrambling one of their upcoming registers into a drift."],
    ];
    const ITEM_HELP = [
      ["#", "\u25a9", "#7fa8c0"],
      [".", "\u00b7", "#4a7186"],
      ["S", "\u2b1a", "#3cf"],
      ["D", "\u25c6", "#3ccfff"],
      ["X", "\u25a2", "#4caf50"],
      ["M", "\u2739", "#e05555"],
      ["V", "\u203f", "#ff8c3c"],
    ];

    function buildHelp() {
      if (el.helpBody.dataset.built) return;
      const cards = CARD_HELP.map(([kind, desc]) => {
        const m = CARD_META[kind] || { label: kind, glyph: "?" };
        return `<div class="help-row"><div class="help-glyph">${m.glyph}</div>` +
          `<div class="help-name">${m.label}</div>` +
          `<div class="help-desc">${desc}</div></div>`;
      }).join("");
      const items = ITEM_HELP.map(([ch, glyph, color]) => {
        const f = FEATURE_TIP[ch];
        return `<div class="help-row">` +
          `<div class="help-glyph" style="color:${color}">${glyph}</div>` +
          `<div class="help-name">${f.title}</div>` +
          `<div class="help-desc">${f.sub}</div></div>`;
      }).join("");
      el.helpBody.innerHTML =
        `<div class="help-section"><p class="help-intro">Each round, queue up to 5 ` +
        `cards into your registers, then Lock In. All fleets' cards execute in ` +
        `register order. Locking in with no cards holds position (a pass).</p></div>` +
        `<div class="help-section"><h3>Cards</h3>${cards}</div>` +
        `<div class="help-section"><h3>Map items</h3>${items}</div>` +
        `<div class="help-section"><h3>Fog of war &amp; sonar</h3>` +
        `<p class="help-intro">You only see the water around you: a ring of ` +
        `tiles next to your sub plus a cone in the direction you face. ` +
        `Everything else is dark, and walls block your line of sight. Enemy ` +
        `subs appear only when they enter your view, so they slip in and out ` +
        `of contact as everyone moves.</p>` +
        `<div class="help-row"><div class="help-glyph">\u25cc</div>` +
        `<div class="help-name">Passive</div>` +
        `<div class="help-desc">Silent listening (the default). Short range, ` +
        `but nobody is told where you are.</div></div>` +
        `<div class="help-row"><div class="help-glyph" style="color:#ffd45e">\u25c9</div>` +
        `<div class="help-name">Active</div>` +
        `<div class="help-desc">Ping for a wider ring and a longer cone \u2014 ` +
        `but your position is broadcast to every player until you go quiet ` +
        `again. Use the Sonar button to toggle.</div></div>` +
        `<div class="help-row"><div class="help-glyph">\u2b07</div>` +
        `<div class="help-name">Depth</div>` +
        `<div class="help-desc">Diving deep shortens your sonar cone \u2014 you ` +
        `trade sight for protection from torpedoes.</div></div>` +
        `<div class="help-row"><div class="help-glyph">\u2601</div>` +
        `<div class="help-name">Ink cloud</div>` +
        `<div class="help-desc">Blocks vision through its tile for 2 rounds, ` +
        `hiding whatever sits behind it \u2014 even from active sonar.</div></div>` +
        `<p class="help-intro">Destroyed or watching from the sidelines? ` +
        `Spectators see the whole board with no fog.</p></div>` +
        `<div class="help-section"><h3>The Black Box hunt</h3>` +
        `<p class="help-intro">Win by collecting telemetry and escaping. Your ` +
        `data count is shown next to the round number.</p>` +
        `<div class="help-row"><div class="help-glyph" style="color:#3cf">\u25c8</div>` +
        `<div class="help-name">Data node</div>` +
        `<div class="help-desc">Hidden until it enters your sonar range. End a ` +
        `round on top of one to download it (+1 data).</div></div>` +
        `<div class="help-row"><div class="help-glyph" style="color:#4caf50">\u25ce</div>` +
        `<div class="help-name">Extraction zone</div>` +
        `<div class="help-desc">A surface rescue ship that patrols the top of ` +
        `the map. Reach it at Shallow depth carrying ${state.winData} data to ` +
        `extract and win.</div></div>` +
        `<div class="help-row"><div class="help-glyph" style="color:#ffd45e">\u26a0</div>` +
        `<div class="help-name">Announcement</div>` +
        `<div class="help-desc">Once you hold enough data to extract, your ` +
        `position is revealed to everyone for a turn \u2014 the whole fleet ` +
        `hunts the leader.</div></div>` +
        `<div class="help-row"><div class="help-glyph" style="color:#e05555">\u27a4</div>` +
        `<div class="help-name">Data theft</div>` +
        `<div class="help-desc">Torpedo a data-laden rival and they drop a ` +
        `node on their tile for anyone to recover.</div></div></div>` +
        `<div class="help-section"><h3>A shifting trench</h3>` +
        `<div class="help-row"><div class="help-glyph" style="color:#7a5a3a">\u25a3</div>` +
        `<div class="help-name">Collapse</div>` +
        `<div class="help-desc">Every few rounds a trench section caves in and ` +
        `becomes solid rock. Collapses never trap a sub or seal off the map, ` +
        `but they reshape routes \u2014 don\u2019t get too comfortable.</div>` +
        `</div></div>`;
      el.helpBody.dataset.built = "1";
    }

    function openHelp() { buildHelp(); el.helpModal.classList.remove("hidden"); }
    function closeHelp() { el.helpModal.classList.add("hidden"); }

    el.btnHelp.addEventListener("click", openHelp);
    el.btnHelpClose.addEventListener("click", closeHelp);
    el.helpModal.addEventListener("click", (ev) => {
      if (ev.target === el.helpModal) closeHelp();
    });

    function closeGameOver() { el.gameOverModal.classList.add("hidden"); }
    el.btnGameOverClose.addEventListener("click", closeGameOver);
    el.gameOverModal.addEventListener("click", (ev) => {
      if (ev.target === el.gameOverModal) closeGameOver();
    });
    document.addEventListener("keydown", (ev) => {
      if (ev.key === "Escape" && !el.helpModal.classList.contains("hidden")) closeHelp();
    });


    // When the tab becomes visible again: if the socket got stuck CONNECTING
    // while throttled in the background, close it so the reconnect loop retries
    // promptly instead of hanging. (Replay timing is handled by the pause-aware
    // clock in tick(), so no animation reset is needed here.)
    document.addEventListener("visibilitychange", () => {
      if (document.hidden) return;
      if (state.ws && state.ws.readyState === WebSocket.CONNECTING) {
        try { state.ws.close(); } catch (_) {}
      }
    });

    function leaveRoom() {
      send("leave_game", {});
      state.roomCode = null; state.isHost = false; state.lobby = null;
      state.board = null; state.subs = [];
      state.round = 0; state.program = []; state.locked = false;
      state.anim = null; state.lockTally = null;
      setView("home");
    }

    function persistName() {
      const name = el.nameInput.value.trim();
      if (name) localStorage.setItem(LS_NAME, name);
    }

    // --- init -----------------------------------------------------------
    el.nameInput.value = localStorage.getItem(LS_NAME) || "";
    updateSoundButton();
    setView("home");
    log("sys", "Ready.");
    connect();
    requestAnimationFrame(tick);
  </script>
</body>
</html>
