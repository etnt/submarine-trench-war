<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Submarine Trench War</title>
  <style>
    :root {
      --bg: #041018;
      --bg-panel: #0a1f2e;
      --accent: #3cf;
      --accent-dim: #1a6b82;
      --text: #cfe8f2;
      --muted: #7fa6b8;
      --ok: #4caf50;
      --err: #e05555;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: radial-gradient(circle at 50% -10%, #0a2436, var(--bg));
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    header { text-align: center; padding: 24px 16px 8px; }
    h1 {
      margin: 0;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-size: 1.6rem;
      color: var(--accent);
    }
    .subtitle { opacity: 0.6; font-size: 0.85rem; }
    main {
      width: min(720px, 92vw);
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding: 16px;
    }
    .panel {
      background: var(--bg-panel);
      border: 1px solid var(--accent-dim);
      border-radius: 10px;
      padding: 16px;
    }
    .panel h2 {
      margin: 0 0 12px;
      font-size: 1rem;
      color: var(--accent);
      font-weight: 600;
    }
    .status-row { display: flex; align-items: center; gap: 10px; font-size: 0.9rem; }
    .dot {
      width: 12px; height: 12px; border-radius: 50%;
      background: var(--err);
      box-shadow: 0 0 8px currentColor;
      transition: background 0.2s;
    }
    .dot.connected { background: var(--ok); }
    .controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    button {
      background: var(--accent-dim);
      color: var(--text);
      border: 1px solid var(--accent);
      border-radius: 6px;
      padding: 8px 14px;
      font-size: 0.9rem;
      cursor: pointer;
      transition: background 0.15s;
    }
    button:hover:not(:disabled) { background: var(--accent); color: #02090f; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    button.primary { background: var(--accent); color: #02090f; font-weight: 600; }
    input {
      background: #02090f;
      color: var(--text);
      border: 1px solid var(--accent-dim);
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 0.9rem;
    }
    input:focus { outline: 1px solid var(--accent); }
    label { font-size: 0.85rem; color: var(--muted); display: block; margin-bottom: 4px; }
    .field { margin-bottom: 12px; }
    .hidden { display: none !important; }
    .room-code {
      font-family: "SF Mono", Menlo, Consolas, monospace;
      font-size: 1.4rem;
      letter-spacing: 0.2em;
      color: var(--accent);
    }
    ul.players { list-style: none; margin: 0; padding: 0; }
    ul.players li {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      border-radius: 6px;
      background: #02090f;
      margin-bottom: 6px;
    }
    .badge {
      font-size: 0.7rem;
      padding: 2px 6px;
      border-radius: 4px;
      background: var(--accent-dim);
      color: var(--text);
    }
    .badge.host { background: #b8860b; color: #02090f; }
    .badge.ready { background: var(--ok); color: #02090f; }
    .badge.offline { background: #444; color: #aaa; }
    .pname { flex: 1; }
    .swatch { width: 12px; height: 12px; border-radius: 3px; }
    canvas#board {
      width: 100%;
      height: auto;
      display: block;
      background: #02090f;
      border: 1px solid var(--accent-dim);
      border-radius: 8px;
      image-rendering: auto;
      margin-bottom: 12px;
    }
    #log {
      font-family: "SF Mono", Menlo, Consolas, monospace;
      font-size: 0.74rem;
      background: #02090f;
      border-radius: 8px;
      padding: 12px;
      height: 150px;
      overflow-y: auto;
      white-space: pre-wrap;
      line-height: 1.5;
    }
    .log-in { color: var(--accent); }
    .log-out { color: #8fd694; }
    .log-sys { color: #b0b0b0; }
    .log-err { color: var(--err); }
    .toast {
      color: var(--err);
      font-size: 0.85rem;
      min-height: 1.2em;
      margin-top: 8px;
    }

    /* --- register programming --- */
    #program { margin-bottom: 4px; }
    .prog-head {
      display: flex; justify-content: space-between; align-items: baseline;
      font-size: 0.9rem; color: var(--accent); margin-bottom: 8px;
    }
    .ping-timer {
      font-family: "SF Mono", Menlo, Consolas, monospace;
      font-size: 0.85rem; color: var(--accent); padding: 1px 8px;
      border: 1px solid var(--accent-dim); border-radius: 10px;
      margin-right: 10px;
    }
    .ping-timer.urgent { color: var(--err); border-color: var(--err); }
    .hand-label { margin: 2px 0 6px; }
    .slots { display: flex; gap: 8px; margin-bottom: 12px; }
    .slot {
      flex: 1; aspect-ratio: 3 / 4; min-height: 56px;
      border: 1px dashed var(--accent-dim); border-radius: 8px;
      background: #02090f; color: var(--text);
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 2px; cursor: pointer;
      font-size: 0.72rem; text-align: center; padding: 4px;
      transition: border-color 0.15s, background 0.15s;
    }
    .slot .idx { color: var(--muted); font-size: 0.62rem; }
    .slot.filled { border-style: solid; border-color: var(--accent); }
    .slot .glyph { font-size: 1.1rem; line-height: 1; }
    .slot.locked { opacity: 0.7; cursor: default; }
    .palette { display: flex; flex-wrap: wrap; gap: 6px; }
    .card-btn {
      font-size: 0.74rem; padding: 6px 8px; line-height: 1.15;
      display: flex; flex-direction: column; align-items: center; gap: 1px;
      min-width: 60px;
    }
    .card-btn .glyph { font-size: 1rem; }
    .card-btn.used { opacity: 0.32; }
    #program.locked .palette, #program.locked .slots { pointer-events: none; opacity: 0.6; }
  </style>
</head>
<body>
  <header>
    <h1>Submarine Trench War</h1>
    <div class="subtitle">Phase 5 &mdash; hazards &amp; combat</div>
  </header>

  <main>
    <div class="panel">
      <div class="status-row">
        <span class="dot" id="statusDot"></span>
        <span id="statusText">Disconnected</span>
        <span style="flex:1"></span>
        <span id="whoami" class="subtitle"></span>
      </div>
    </div>

    <!-- HOME: create or join -->
    <div class="panel" id="viewHome">
      <h2>Set Sail</h2>
      <div class="field">
        <label for="nameInput">Captain name</label>
        <input id="nameInput" type="text" placeholder="Nautilus" maxlength="20" />
      </div>
      <div class="controls" style="margin-bottom: 14px;">
        <button id="btnCreate" class="primary">Create Room</button>
      </div>
      <div class="field">
        <label for="roomInput">Join with room code</label>
        <div class="controls">
          <input id="roomInput" type="text" placeholder="REEF12" maxlength="6"
                 style="text-transform: uppercase;" />
          <button id="btnJoin">Join Room</button>
        </div>
      </div>
      <div class="toast" id="homeToast"></div>
    </div>

    <!-- LOBBY: room + players -->
    <div class="panel hidden" id="viewLobby">
      <h2>Wardroom</h2>
      <div class="field">
        <label>Room code (share with your fleet)</label>
        <span class="room-code" id="roomCode">------</span>
      </div>
      <ul class="players" id="playerList"></ul>
      <div class="controls" style="margin-top: 12px;">
        <button id="btnReady">Ready Up</button>
        <button id="btnStart" class="primary hidden">Dive! (Start)</button>
        <button id="btnLeave">Leave</button>
      </div>
      <div class="toast" id="lobbyToast"></div>
    </div>

    <!-- GAME: board + fleet -->
    <div class="panel hidden" id="viewGame">
      <h2>Match In Progress <span id="roundTag" class="badge">Round 1</span></h2>
      <canvas id="board" width="600" height="360"></canvas>

      <!-- Register programming -->
      <div id="program">
        <div class="prog-head">
          <span>Draft 5 cards into your registers</span>
          <span style="flex:1"></span>
          <span id="pingTimer" class="ping-timer hidden">30s</span>
          <span id="lockTally" class="subtitle">0 / 0 locked</span>
        </div>
        <div class="slots" id="slots"></div>
        <div class="hand-label subtitle">Your hand</div>
        <div class="palette" id="palette"></div>
        <div class="controls" style="margin-top: 10px;">
          <button id="btnClear">Clear</button>
          <button id="btnLock" class="primary" disabled>Lock In</button>
          <span id="progToast" class="subtitle" style="flex:1"></span>
        </div>
      </div>

      <ul class="players" id="gamePlayers" style="margin-top: 12px;"></ul>
      <div class="controls" style="margin-top: 12px;">
        <button id="btnLeaveGame">Leave Match</button>
      </div>
    </div>

    <div class="panel">
      <h2>Console</h2>
      <div id="log" aria-live="polite"></div>
    </div>
  </main>

  <script>
    "use strict";

    const LS_TOKEN = "stw_session_token";
    const LS_NAME = "stw_display_name";

    const state = {
      ws: null,
      seq: 0,
      connected: false,
      playerId: null,
      token: localStorage.getItem(LS_TOKEN) || null,
      roomCode: null,
      isHost: false,
      view: "home",     // home | lobby | game
      lobby: null,      // last lobby_state payload
      board: null,      // { width, height, grid, legend }
      subs: [],         // [{ player_id, color, x, y, facing, depth, hull, ... }]
      round: 0,         // current round number
      cards: [],        // available card kinds this round
      program: [],      // my chosen kinds (up to 5)
      locked: false,    // have I locked this round?
      lockTally: null,  // { locked, total } from player_locked
      anim: null,       // active replay animation, or null
      hand: [],         // my dealt cards this round: [{ id, kind }]
      timerEndsAt: null,// Ping Timer deadline (epoch ms), or null
    };

    // Card metadata: label + glyph for the UI.
    const CARD_META = {
      ahead_standard: { label: "Ahead 1", glyph: "\u2191" },
      ahead_flank:    { label: "Ahead 2", glyph: "\u21c8" },
      reverse:        { label: "Reverse", glyph: "\u2193" },
      port_bank:      { label: "Port",    glyph: "\u21b0" },
      starboard_bank: { label: "Starb'd", glyph: "\u21b1" },
      dive:           { label: "Dive",    glyph: "\u2b07" },
      surface:        { label: "Surface", glyph: "\u2b06" },
      torpedo:        { label: "Torpedo", glyph: "\u27a4" },
      depth_charge:   { label: "D.Charge", glyph: "\u25c9" },
      sonar_ping:     { label: "Sonar",   glyph: "\u25cc" },
    };
    // Cards that actually move the sub (for the path preview).
    const MOVE_CARDS = { ahead_standard: 1, ahead_flank: 2, reverse: 1 };
    const REGISTERS = 5;

    const $ = (id) => document.getElementById(id);
    const el = {
      dot: $("statusDot"), statusText: $("statusText"), whoami: $("whoami"),
      log: $("log"),
      viewHome: $("viewHome"), viewLobby: $("viewLobby"), viewGame: $("viewGame"),
      nameInput: $("nameInput"), roomInput: $("roomInput"),
      btnCreate: $("btnCreate"), btnJoin: $("btnJoin"),
      roomCode: $("roomCode"), playerList: $("playerList"),
      btnReady: $("btnReady"), btnStart: $("btnStart"), btnLeave: $("btnLeave"),
      gamePlayers: $("gamePlayers"), btnLeaveGame: $("btnLeaveGame"),
      homeToast: $("homeToast"), lobbyToast: $("lobbyToast"),
      canvas: $("board"),
      roundTag: $("roundTag"), lockTally: $("lockTally"),
      slots: $("slots"), palette: $("palette"),
      btnClear: $("btnClear"), btnLock: $("btnLock"),
      progToast: $("progToast"), program: $("program"),
      pingTimer: $("pingTimer"),
    };
    const ctx = el.canvas.getContext("2d");

    // --- logging --------------------------------------------------------
    function log(kind, text) {
      const line = document.createElement("div");
      line.className = "log-" + kind;
      line.textContent = `[${new Date().toLocaleTimeString()}] ${text}`;
      el.log.appendChild(line);
      el.log.scrollTop = el.log.scrollHeight;
    }

    // --- connection -----------------------------------------------------
    function wsUrl() {
      const proto = location.protocol === "https:" ? "wss:" : "ws:";
      return `${proto}//${location.host}/ws`;
    }

    function setConnected(connected) {
      state.connected = connected;
      el.dot.classList.toggle("connected", connected);
      el.statusText.textContent = connected ? "Connected" : "Disconnected";
    }

    function connect() {
      if (state.ws) return;
      log("sys", `Connecting to ${wsUrl()} ...`);
      const ws = new WebSocket(wsUrl());
      state.ws = ws;
      ws.onopen = () => {
        setConnected(true);
        const name = el.nameInput.value.trim()
          || localStorage.getItem(LS_NAME) || "Captain";
        send("hello", { protocol_version: 1, display_name: name,
                        session_token: state.token || undefined });
      };
      ws.onmessage = (e) => onMessage(e.data);
      ws.onerror = () => log("err", "WebSocket error.");
      ws.onclose = () => {
        setConnected(false);
        state.ws = null;
        log("sys", "Disconnected. Reconnecting in 1s ...");
        setTimeout(connect, 1000);
      };
    }

    function send(type, payload) {
      if (!state.ws || state.ws.readyState !== WebSocket.OPEN) {
        log("err", "Not connected."); return;
      }
      const msg = { type, seq: state.seq++, ts: Date.now(), payload: payload || {} };
      state.ws.send(JSON.stringify(msg));
      log("out", "\u2192 " + type);
    }

    // --- message handling ----------------------------------------------
    function onMessage(data) {
      let msg;
      try { msg = JSON.parse(data); }
      catch { log("err", "Bad JSON from server."); return; }
      log("in", "\u2190 " + msg.type);
      const p = msg.payload || {};
      switch (msg.type) {
        case "welcome": onWelcome(p); break;
        case "game_joined": onGameJoined(p); break;
        case "lobby_state": onLobbyState(p); break;
        case "game_started": onGameStarted(p); break;
        case "round_started": onRoundStarted(p); break;
        case "deal_hand": onDealHand(p); break;
        case "player_locked": onPlayerLocked(p); break;
        case "timer_started": onTimerStarted(p); break;
        case "registers_resolving": onRegistersResolving(p); break;
        case "round_result": onRoundResult(p); break;
        case "revealed_cards": onRevealedCards(p); break;
        case "game_state": onGameState(p); break;
        case "error": onError(p); break;
        case "pong": break;
        default: break;
      }
    }

    function onWelcome(p) {
      state.playerId = p.player_id;
      state.token = p.session_token;
      localStorage.setItem(LS_TOKEN, state.token);
      el.whoami.textContent =
        `${el.nameInput.value.trim() || "Captain"} \u00b7 ${p.player_id}`;
      log("sys", `Welcome. player_id=${p.player_id}`);
      // If the server puts us back in a room, a lobby_state/game_started
      // will follow and switch the view; otherwise we stay on home.
    }

    function onGameJoined(p) {
      state.roomCode = p.room_code;
      state.isHost = !!p.is_host;
      setView("lobby");
      el.roomCode.textContent = p.room_code;
      clearToast();
    }

    function onLobbyState(p) {
      state.lobby = p;
      state.roomCode = p.room_code;
      state.isHost = (p.host_id === state.playerId);
      if (p.phase === "playing") {
        renderGamePlayers({ players: state.subs.length ? state.subs : p.players });
        setView("game");
      } else { renderLobby(p); if (state.view !== "lobby") setView("lobby"); }
    }

    function onGameStarted(p) {
      state.roomCode = p.room_code;
      if (p.board) state.board = p.board;
      if (p.submarines) state.subs = p.submarines;
      renderGamePlayers({ players: p.submarines });
      setView("game");
      log("sys", "Game started.");
    }

    function onRoundStarted(p) {
      state.round = p.round || state.round;
      state.program = [];
      state.locked = false;
      state.anim = null;
      state.timerEndsAt = null;
      el.pingTimer.classList.add("hidden");
      el.roundTag.textContent = "Round " + state.round;
      el.program.classList.remove("locked");
      renderSlots();
      el.progToast.textContent = "";
      log("sys", "Round " + state.round + " \u2014 draft your registers.");
    }

    function onDealHand(p) {
      if (p.player_id && p.player_id !== state.playerId) return;
      state.hand = p.cards || [];
      renderPalette();
      renderSlots();
    }

    function onPlayerLocked(p) {
      state.lockTally = { locked: p.locked, total: p.total };
      el.lockTally.textContent = `${p.locked} / ${p.total} locked`;
    }

    function onTimerStarted(p) {
      state.timerEndsAt = p.ends_at || (Date.now() + (p.duration_ms || 30000));
      el.pingTimer.classList.remove("hidden");
      log("sys", "Ping Timer started.");
    }

    function onRegistersResolving(p) {
      state.timerEndsAt = null;
      el.pingTimer.classList.add("hidden");
      const auto = (p.auto_filled || []);
      if (auto.includes(state.playerId)) {
        el.progToast.textContent = "Timer expired \u2014 registers auto-filled!";
      }
    }

    function onRoundResult(p) {
      state.timerEndsAt = null;
      el.pingTimer.classList.add("hidden");
      // Consumed mines are gone: scrub them from the local board grid.
      (p.mines_cleared || []).forEach((m) => clearMineTile(m.x, m.y));
      // Replay the phases, then settle on the authoritative final subs.
      const finalSubs = p.submarines || state.subs;
      startReplay(p.phases || [], finalSubs);
      logCombat(p.phases || []);
      log("sys", "Round " + p.round + " resolved (" +
        (p.phases ? p.phases.length : 0) + " phases).");
    }

    // Replace a mine tile ("M") with open trench (".") in the local grid.
    function clearMineTile(x, y) {
      const b = state.board;
      if (!b || !b.grid || !b.grid[y]) return;
      const row = b.grid[y];
      if ((row[x] || "") === "M") {
        b.grid[y] = row.slice(0, x) + "." + row.slice(x + 1);
      }
    }

    // Summarise notable combat events from a resolved round into the log.
    function logCombat(phases) {
      const nameOf = (id) => {
        const s = (state.subs || []).find((x) => x.player_id === id);
        return s ? (s.display_name || id) : id;
      };
      phases.forEach((ph) => (ph.events || []).forEach((ev) => {
        if (ev.type === "hit") {
          log("sys", nameOf(ev.player_id) + " took " + ev.damage +
            " from " + ev.weapon + ".");
        } else if (ev.type === "mine") {
          log("sys", nameOf(ev.player_id) + " hit a mine!");
        } else if (ev.type === "ram") {
          log("sys", nameOf(ev.player_id) + " rammed.");
        } else if (ev.type === "destroyed") {
          log("err", nameOf(ev.player_id) + " was destroyed!");
        }
      }));
    }

    function onRevealedCards(p) {
      const nameOf = (id) => {
        const s = (state.subs || []).find((x) => x.player_id === id);
        return s ? (s.display_name || id) : id;
      };
      const labels = (p.registers || [])
        .map((k) => (CARD_META[k] || { label: k }).label);
      log("sys", "Sonar reveals " + nameOf(p.player_id) + ": " +
        labels.join(" \u2192 "));
    }

    function onGameState(p) {
      state.round = p.round || state.round;
      if (p.submarines) {
        // Don't clobber an in-flight replay; it sets subs at the end.
        if (!state.anim) state.subs = p.submarines;
        renderGamePlayers({ players: p.submarines });
      }
      el.roundTag.textContent = "Round " + state.round;
    }

    function onError(p) {
      log("err", `error[${p.code}] ${p.message}`);
      const target = state.view === "home" ? el.homeToast : el.lobbyToast;
      target.textContent = p.message || p.code;
      setTimeout(() => { target.textContent = ""; }, 4000);
    }

    function clearToast() {
      el.homeToast.textContent = ""; el.lobbyToast.textContent = "";
    }

    // --- rendering ------------------------------------------------------
    function setView(view) {
      state.view = view;
      el.viewHome.classList.toggle("hidden", view !== "home");
      el.viewLobby.classList.toggle("hidden", view !== "lobby");
      el.viewGame.classList.toggle("hidden", view !== "game");
    }

    function renderLobby(p) {
      el.roomCode.textContent = p.room_code || "------";
      el.playerList.innerHTML = "";
      let me = null;
      (p.players || []).forEach((pl) => {
        if (pl.player_id === state.playerId) me = pl;
        const li = document.createElement("li");
        const name = document.createElement("span");
        name.className = "pname";
        name.textContent = pl.display_name;
        li.appendChild(name);
        if (pl.player_id === p.host_id) li.appendChild(badge("host", "HOST"));
        if (pl.ready) li.appendChild(badge("ready", "READY"));
        if (!pl.connected) li.appendChild(badge("offline", "OFFLINE"));
        el.playerList.appendChild(li);
      });
      el.btnReady.textContent = (me && me.ready) ? "Not Ready" : "Ready Up";
      const players = p.players || [];
      const allReady =
        players.length >= 2 && players.every((x) => x.ready || !x.connected);
      el.btnStart.classList.toggle("hidden", !state.isHost);
      el.btnStart.disabled = !(state.isHost && allReady);
    }

    function renderGamePlayers(p) {
      el.gamePlayers.innerHTML = "";
      (p.players || []).forEach((pl) => {
        const li = document.createElement("li");
        if (pl.color) {
          const sw = document.createElement("span");
          sw.className = "swatch";
          sw.style.background = pl.color;
          li.appendChild(sw);
        }
        const name = document.createElement("span");
        name.className = "pname";
        name.textContent = pl.display_name || pl.player_id;
        li.appendChild(name);
        if (typeof pl.depth === "string") li.appendChild(badge("", pl.depth));
        if (typeof pl.hull === "number") li.appendChild(badge("", "hull " + pl.hull));
        el.gamePlayers.appendChild(li);
      });
    }

    // --- register programming -------------------------------------------
    // state.hand = [{ id, kind }]; state.program = ordered card IDs.
    function kindOfCard(id) {
      const c = state.hand.find((c) => c.id === id);
      return c ? c.kind : null;
    }

    function renderPalette() {
      el.palette.innerHTML = "";
      state.hand.forEach((card) => {
        const meta = CARD_META[card.kind] || { label: card.kind, glyph: "?" };
        const used = state.program.includes(card.id);
        const b = document.createElement("button");
        b.className = "card-btn" + (used ? " used" : "");
        b.innerHTML =
          `<span class="glyph">${meta.glyph}</span><span>${meta.label}</span>`;
        b.title = card.kind;
        b.disabled = used || state.locked;
        b.addEventListener("click", () => addCard(card.id));
        el.palette.appendChild(b);
      });
    }

    function renderSlots() {
      el.slots.innerHTML = "";
      for (let i = 0; i < REGISTERS; i++) {
        const id = state.program[i];
        const kind = id ? kindOfCard(id) : null;
        const slot = document.createElement("div");
        slot.className = "slot" + (kind ? " filled" : "") +
          (state.locked ? " locked" : "");
        if (kind) {
          const meta = CARD_META[kind] || { label: kind, glyph: "?" };
          slot.innerHTML = `<span class="idx">${i + 1}</span>` +
            `<span class="glyph">${meta.glyph}</span><span>${meta.label}</span>`;
          if (!state.locked) slot.addEventListener("click", () => removeCard(i));
        } else {
          slot.innerHTML = `<span class="idx">${i + 1}</span><span>&middot;</span>`;
        }
        el.slots.appendChild(slot);
      }
      renderPalette();
      updateLockButton();
    }

    function addCard(id) {
      if (state.locked) return;
      if (state.program.length >= REGISTERS) return;
      if (state.program.includes(id)) return;
      state.program.push(id);
      renderSlots();
    }

    function removeCard(i) {
      if (state.locked) return;
      state.program.splice(i, 1);
      renderSlots();
    }

    function updateLockButton() {
      el.btnLock.disabled = state.locked || state.program.length !== REGISTERS;
    }

    function lockRegisters() {
      if (state.program.length !== REGISTERS || state.locked) return;
      send("program_registers", { registers: state.program.slice() });
      send("lock_registers", {});
      state.locked = true;
      el.program.classList.add("locked");
      el.progToast.textContent = "Locked. Waiting for the fleet\u2026";
      renderSlots();
    }

    // --- board rendering -----------------------------------------------
    const TILE = {
      "#": { fill: "#0a2233" },   // wall
      ".": { fill: "#04161f" },   // trench
      "S": { fill: "#062a38" },   // spawn
      "D": { fill: "#04161f" },   // data node
      "X": { fill: "#04161f" },   // extraction
      "M": { fill: "#04161f" },   // mine
      "V": { fill: "#04161f" },   // vent
    };
    const FACING_ANGLE = { N: -Math.PI / 2, E: 0, S: Math.PI / 2, W: Math.PI };

    function renderBoard(t) {
      const b = state.board;
      const cv = el.canvas, g = ctx;
      g.clearRect(0, 0, cv.width, cv.height);
      if (!b || !b.grid) return;
      const size = Math.floor(Math.min(cv.width / b.width, cv.height / b.height));
      const ox = Math.floor((cv.width - size * b.width) / 2);
      const oy = Math.floor((cv.height - size * b.height) / 2);

      for (let y = 0; y < b.height; y++) {
        const row = b.grid[y] || "";
        for (let x = 0; x < b.width; x++) {
          const ch = row[x] || "#";
          const px = ox + x * size, py = oy + y * size;
          g.fillStyle = (TILE[ch] || TILE["."]).fill;
          g.fillRect(px, py, size, size);
          g.strokeStyle = "rgba(60,204,255,0.05)";
          g.strokeRect(px + 0.5, py + 0.5, size, size);
          drawFeature(g, ch, px, py, size, t);
        }
      }

      const subs = state.anim ? animatedSubs(t) : state.subs;
      if (!state.anim) drawGhostPath(g, ox, oy, size);
      subs.forEach((s) => drawSub(g, s, ox, oy, size, t));
      if (state.anim) drawPhaseFX(g, ox, oy, size, t, subs);
    }

    function drawFeature(g, ch, px, py, size, t) {
      const cx = px + size / 2, cy = py + size / 2, r = size * 0.28;
      const pulse = 0.6 + 0.4 * Math.sin(t / 400);
      if (ch === "D") {              // data node: cyan diamond
        g.save();
        g.translate(cx, cy);
        g.rotate(Math.PI / 4);
        g.fillStyle = `rgba(60,204,255,${0.55 * pulse + 0.3})`;
        g.fillRect(-r, -r, r * 2, r * 2);
        g.restore();
      } else if (ch === "X") {       // extraction: green target
        g.strokeStyle = "#4caf50";
        g.lineWidth = 2;
        g.strokeRect(px + size * 0.2, py + size * 0.2, size * 0.6, size * 0.6);
        g.beginPath();
        g.arc(cx, cy, r * 0.6, 0, Math.PI * 2);
        g.stroke();
      } else if (ch === "M") {       // mine: red spiky dot
        g.fillStyle = "#e05555";
        g.beginPath();
        g.arc(cx, cy, r * 0.5, 0, Math.PI * 2);
        g.fill();
        g.strokeStyle = "#e05555";
        for (let a = 0; a < Math.PI * 2; a += Math.PI / 4) {
          g.beginPath();
          g.moveTo(cx + Math.cos(a) * r * 0.5, cy + Math.sin(a) * r * 0.5);
          g.lineTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r);
          g.stroke();
        }
      } else if (ch === "V") {       // vent: orange rising chevrons
        g.strokeStyle = `rgba(255,140,60,${0.5 + 0.5 * pulse})`;
        g.lineWidth = 2;
        for (let i = 0; i < 2; i++) {
          const yy = cy + r * 0.5 - i * r * 0.8;
          g.beginPath();
          g.moveTo(cx - r * 0.5, yy);
          g.lineTo(cx, yy - r * 0.5);
          g.lineTo(cx + r * 0.5, yy);
          g.stroke();
        }
      } else if (ch === "S") {       // spawn: faint dashed marker
        g.strokeStyle = "rgba(60,204,255,0.25)";
        g.setLineDash([3, 3]);
        g.strokeRect(px + size * 0.25, py + size * 0.25, size * 0.5, size * 0.5);
        g.setLineDash([]);
      }
    }

    function drawSub(g, s, ox, oy, size, t) {
      const cx = ox + s.x * size + size / 2;
      const cy = oy + s.y * size + size / 2;
      const bob = Math.sin(t / 500 + s.x + s.y) * size * 0.04;
      const r = size * 0.34;
      const angle = FACING_ANGLE[s.facing] || 0;
      const deep = s.depth === "deep";

      // wreck: destroyed subs render as a grey hulk, no facing/depth cues
      if (s.alive === false) {
        g.save();
        g.globalAlpha = 0.6;
        g.strokeStyle = "#7a8a92";
        g.lineWidth = 2;
        g.beginPath();
        g.moveTo(cx - r * 0.7, cy - r * 0.7);
        g.lineTo(cx + r * 0.7, cy + r * 0.7);
        g.moveTo(cx + r * 0.7, cy - r * 0.7);
        g.lineTo(cx - r * 0.7, cy + r * 0.7);
        g.stroke();
        g.fillStyle = "rgba(122,138,146,0.35)";
        g.beginPath();
        g.arc(cx, cy, r * 0.9, 0, Math.PI * 2);
        g.fill();
        g.restore();
        return;
      }

      // depth ring: dashed when deep, solid when shallow
      g.strokeStyle = s.color || "#3cf";
      g.lineWidth = 2;
      g.globalAlpha = deep ? 0.5 : 0.9;
      g.setLineDash(deep ? [3, 3] : []);
      g.beginPath();
      g.arc(cx, cy + bob, r * 1.15, 0, Math.PI * 2);
      g.stroke();
      g.setLineDash([]);
      g.globalAlpha = 1;

      // hull body as a facing triangle
      g.save();
      g.translate(cx, cy + bob);
      g.rotate(angle);
      g.fillStyle = s.color || "#3cf";
      g.globalAlpha = deep ? 0.65 : 1;
      g.beginPath();
      g.moveTo(r, 0);
      g.lineTo(-r * 0.7, -r * 0.6);
      g.lineTo(-r * 0.7, r * 0.6);
      g.closePath();
      g.fill();
      g.restore();
      g.globalAlpha = 1;

      // hull bar underneath (only when we know the hull value)
      if (typeof s.hull === "number") {
        const frac = Math.max(0, Math.min(1, s.hull / 10));
        const bw = size * 0.6, bh = Math.max(2, size * 0.06);
        const bx = cx - bw / 2, by = cy + r * 1.3;
        g.fillStyle = "rgba(0,0,0,0.5)";
        g.fillRect(bx, by, bw, bh);
        g.fillStyle = frac > 0.5 ? "#4caf50" : frac > 0.25 ? "#e0a020" : "#e05555";
        g.fillRect(bx, by, bw * frac, bh);
      }
    }

    // Draw combat effects for the phase currently animating.
    function drawPhaseFX(g, ox, oy, size, t, subs) {
      const a = state.anim;
      if (!a || !a.phases) return;
      const ph = a.phases[a.seg];
      if (!ph || !ph.events) return;
      const posOf = {};
      subs.forEach((s) => { posOf[s.player_id] = s; });
      const cx = (x) => ox + x * size + size / 2;
      const cy = (y) => oy + y * size + size / 2;
      const fade = 1 - a.frac;               // effects fade over the segment
      g.save();
      for (const ev of ph.events) {
        if (ev.type === "torpedo" || ev.type === "sonar_ping") {
          const isSonar = ev.type === "sonar_ping";
          const path = ev.path || [];
          if (path.length === 0) continue;
          const last = path[path.length - 1];
          g.globalAlpha = 0.4 + 0.5 * fade;
          g.strokeStyle = isSonar ? "#3ce0ff" : "#ffb020";
          g.lineWidth = isSonar ? 2 : 3;
          g.setLineDash(isSonar ? [4, 4] : []);
          g.beginPath();
          g.moveTo(cx(ev.x), cy(ev.y));
          g.lineTo(cx(last.x), cy(last.y));
          g.stroke();
          g.setLineDash([]);
          if (ev.hit) explosion(g, cx(last.x), cy(last.y), size * 0.4, fade,
                                isSonar ? "#3ce0ff" : "#ffb020");
        } else if (ev.type === "explosion") {
          explosion(g, cx(ev.x), cy(ev.y), size * 0.7, fade, "#ff6a30");
        } else if (ev.type === "mine") {
          explosion(g, cx(ev.x), cy(ev.y), size * 0.6, fade, "#e05555");
        } else if (ev.type === "depth_charge_armed") {
          g.globalAlpha = 0.5 + 0.4 * Math.sin(t / 120);
          g.strokeStyle = "#e0a020";
          g.lineWidth = 2;
          g.beginPath();
          g.arc(cx(ev.x), cy(ev.y), size * 0.3, 0, Math.PI * 2);
          g.stroke();
        } else if (ev.type === "ram") {
          const s = posOf[ev.player_id];
          if (s) explosion(g, cx(s.x), cy(s.y), size * 0.35, fade, "#fff2a0");
        } else if (ev.type === "vent") {
          const s = posOf[ev.player_id];
          if (s) {
            g.globalAlpha = 0.4 + 0.5 * fade;
            g.strokeStyle = "#ff8c3c";
            g.lineWidth = 2;
            g.beginPath();
            g.moveTo(cx(s.x), cy(s.y) + size * 0.3);
            g.lineTo(cx(s.x), cy(s.y) - size * 0.3);
            g.moveTo(cx(s.x) - size * 0.15, cy(s.y) - size * 0.1);
            g.lineTo(cx(s.x), cy(s.y) - size * 0.3);
            g.lineTo(cx(s.x) + size * 0.15, cy(s.y) - size * 0.1);
            g.stroke();
          }
        }
      }
      g.restore();
    }

    function explosion(g, x, y, r, fade, color) {
      g.globalAlpha = 0.15 + 0.55 * fade;
      g.fillStyle = color;
      g.beginPath();
      g.arc(x, y, r * (0.6 + 0.6 * (1 - fade)), 0, Math.PI * 2);
      g.fill();
      g.globalAlpha = 0.3 + 0.5 * fade;
      g.strokeStyle = color;
      g.lineWidth = 2;
      g.beginPath();
      g.arc(x, y, r * (0.8 + 0.8 * (1 - fade)), 0, Math.PI * 2);
      g.stroke();
    }

    // --- ghost path preview & phase replay ------------------------------
    const DIR_VEC = { N: [0, -1], E: [1, 0], S: [0, 1], W: [-1, 0] };
    const ROT_L = { N: "W", W: "S", S: "E", E: "N" };
    const ROT_R = { N: "E", E: "S", S: "W", W: "N" };
    const PHASE_MS = 380;

    function isWall(x, y) {
      const b = state.board;
      if (!b || !b.grid) return true;
      if (x < 0 || y < 0 || x >= b.width || y >= b.height) return true;
      return ((b.grid[y] || "")[x] || "#") === "#";
    }

    function mySub() {
      return state.subs.find((s) => s.player_id === state.playerId) || null;
    }

    // Predict my sub's path this round by applying my program locally.
    // Ignores other subs and currents (walls still block); preview only.
    function predictPath(sub, program) {
      let x = sub.x, y = sub.y, f = sub.facing;
      const pts = [{ x, y }];
      for (const kind of program) {
        if (kind === "port_bank") { f = ROT_L[f]; }
        else if (kind === "starboard_bank") { f = ROT_R[f]; }
        else if (MOVE_CARDS[kind]) {
          const steps = MOVE_CARDS[kind];
          let [dx, dy] = DIR_VEC[f];
          if (kind === "reverse") { dx = -dx; dy = -dy; }
          for (let s = 0; s < steps; s++) {
            if (isWall(x + dx, y + dy)) break;
            x += dx; y += dy;
          }
        }
        // dive / surface / torpedo / depth_charge / sonar_ping: no movement
        pts.push({ x, y });
      }
      return pts;
    }

    function drawGhostPath(g, ox, oy, size) {
      if (state.locked || state.program.length === 0) return;
      const me = mySub();
      if (!me) return;
      const kinds = state.program.map(kindOfCard).filter(Boolean);
      const pts = predictPath(me, kinds);
      const cx = (p) => ox + p.x * size + size / 2;
      const cy = (p) => oy + p.y * size + size / 2;
      g.save();
      g.strokeStyle = (me.color || "#3cf");
      g.globalAlpha = 0.4;
      g.setLineDash([4, 4]);
      g.lineWidth = 2;
      g.beginPath();
      g.moveTo(cx(pts[0]), cy(pts[0]));
      pts.forEach((p) => g.lineTo(cx(p), cy(p)));
      g.stroke();
      g.setLineDash([]);
      pts.forEach((p, i) => {
        g.globalAlpha = 0.25 + 0.5 * (i / pts.length);
        g.fillStyle = (me.color || "#3cf");
        g.beginPath();
        g.arc(cx(p), cy(p), size * 0.1, 0, Math.PI * 2);
        g.fill();
      });
      g.restore();
    }

    // Build keyframes and start an interpolated replay of the round.
    function startReplay(phases, finalSubs) {
      const colorById = {};
      state.subs.forEach((s) => { colorById[s.player_id] = s.color; });
      (finalSubs || []).forEach((s) => {
        if (s.color) colorById[s.player_id] = s.color;
      });
      const frames = [snapshotSubs(state.subs)]
        .concat(phases.map((ph) => ph.submarines || []));
      state.anim = { frames, phases, finalSubs, colorById, t0: null, seg: 0, frac: 0 };
    }

    function snapshotSubs(subs) {
      return subs.map((s) => ({
        player_id: s.player_id, x: s.x, y: s.y,
        facing: s.facing, depth: s.depth,
        hull: s.hull, alive: s.alive,
      }));
    }

    function indexById(list) {
      const m = {};
      (list || []).forEach((s) => { m[s.player_id] = s; });
      return m;
    }

    // Interpolated sub positions for the current replay time.
    function animatedSubs(t) {
      const a = state.anim;
      if (a.t0 === null) a.t0 = t;
      const elapsed = t - a.t0;
      const seg = Math.floor(elapsed / PHASE_MS);
      if (seg >= a.frames.length - 1) {
        state.subs = a.finalSubs || state.subs;
        state.anim = null;
        renderGamePlayers({ players: state.subs });
        return state.subs;
      }
      const frac = (elapsed % PHASE_MS) / PHASE_MS;
      a.seg = seg;
      a.frac = frac;
      const from = indexById(a.frames[seg]);
      const to = indexById(a.frames[seg + 1]);
      const out = [];
      Object.keys(to).forEach((id) => {
        const b = to[id];
        const aa = from[id] || b;
        const half = frac < 0.5 ? aa : b;
        out.push({
          player_id: id,
          x: aa.x + (b.x - aa.x) * frac,
          y: aa.y + (b.y - aa.y) * frac,
          facing: half.facing,
          depth: half.depth,
          hull: half.hull,
          alive: half.alive,
          color: a.colorById[id] || "#3cf",
        });
      });
      return out;
    }

    function tick(t) {
      if (state.view === "game") { renderBoard(t); updateTimer(); }
      requestAnimationFrame(tick);
    }

    function updateTimer() {
      if (state.timerEndsAt == null) return;
      const ms = Math.max(0, state.timerEndsAt - Date.now());
      const secs = Math.ceil(ms / 1000);
      el.pingTimer.textContent = secs + "s";
      el.pingTimer.classList.toggle("urgent", secs <= 10);
    }

    function badge(cls, text) {
      const b = document.createElement("span");
      b.className = "badge " + cls;
      b.textContent = text;
      return b;
    }

    function myReady() {
      if (!state.lobby) return false;
      const me = (state.lobby.players || [])
        .find((x) => x.player_id === state.playerId);
      return me ? me.ready : false;
    }

    // --- actions --------------------------------------------------------
    el.btnCreate.addEventListener("click", () => {
      persistName();
      send("create_game", { max_players: 4, map_id: "trench_alpha" });
    });
    el.btnJoin.addEventListener("click", () => {
      persistName();
      const code = el.roomInput.value.trim().toUpperCase();
      if (!code) { el.homeToast.textContent = "Enter a room code."; return; }
      send("join_game", { room_code: code });
    });
    el.btnReady.addEventListener("click", () =>
      send("set_ready", { ready: !myReady() }));
    el.btnStart.addEventListener("click", () => send("start_game", {}));
    el.btnLeave.addEventListener("click", leaveRoom);
    el.btnLeaveGame.addEventListener("click", leaveRoom);
    el.btnClear.addEventListener("click", () => {
      if (state.locked) return;
      state.program = [];
      renderSlots();
    });
    el.btnLock.addEventListener("click", lockRegisters);

    function leaveRoom() {
      send("leave_game", {});
      state.roomCode = null; state.isHost = false; state.lobby = null;
      state.board = null; state.subs = [];
      state.round = 0; state.program = []; state.locked = false;
      state.anim = null; state.lockTally = null;
      setView("home");
    }

    function persistName() {
      const name = el.nameInput.value.trim();
      if (name) localStorage.setItem(LS_NAME, name);
    }

    // --- init -----------------------------------------------------------
    el.nameInput.value = localStorage.getItem(LS_NAME) || "";
    setView("home");
    log("sys", "Ready.");
    connect();
    requestAnimationFrame(tick);
  </script>
</body>
</html>
