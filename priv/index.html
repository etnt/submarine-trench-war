<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Submarine Trench War</title>
  <style>
    :root {
      --bg: #041018;
      --bg-panel: #0a1f2e;
      --accent: #3cf;
      --accent-dim: #1a6b82;
      --text: #cfe8f2;
      --muted: #7fa6b8;
      --ok: #4caf50;
      --err: #e05555;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: radial-gradient(circle at 50% -10%, #0a2436, var(--bg));
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    header { text-align: center; padding: 24px 16px 8px; }
    h1 {
      margin: 0;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-size: 1.6rem;
      color: var(--accent);
    }
    .subtitle { opacity: 0.6; font-size: 0.85rem; }
    main {
      width: min(720px, 92vw);
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding: 16px;
    }
    .panel {
      background: var(--bg-panel);
      border: 1px solid var(--accent-dim);
      border-radius: 10px;
      padding: 16px;
    }
    .panel h2 {
      margin: 0 0 12px;
      font-size: 1rem;
      color: var(--accent);
      font-weight: 600;
    }
    .status-row { display: flex; align-items: center; gap: 10px; font-size: 0.9rem; }
    .dot {
      width: 12px; height: 12px; border-radius: 50%;
      background: var(--err);
      box-shadow: 0 0 8px currentColor;
      transition: background 0.2s;
    }
    .dot.connected { background: var(--ok); }
    .controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    button {
      background: var(--accent-dim);
      color: var(--text);
      border: 1px solid var(--accent);
      border-radius: 6px;
      padding: 8px 14px;
      font-size: 0.9rem;
      cursor: pointer;
      transition: background 0.15s;
    }
    button:hover:not(:disabled) { background: var(--accent); color: #02090f; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    button.primary { background: var(--accent); color: #02090f; font-weight: 600; }
    input {
      background: #02090f;
      color: var(--text);
      border: 1px solid var(--accent-dim);
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 0.9rem;
    }
    input:focus { outline: 1px solid var(--accent); }
    label { font-size: 0.85rem; color: var(--muted); display: block; margin-bottom: 4px; }
    .field { margin-bottom: 12px; }
    .hidden { display: none !important; }
    .map-tip {
      position: fixed;
      z-index: 50;
      pointer-events: none;
      max-width: 220px;
      padding: 6px 9px;
      font-size: 12px;
      line-height: 1.35;
      color: #dff3ff;
      background: rgba(2, 12, 20, 0.95);
      border: 1px solid var(--accent-dim);
      border-radius: 6px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.5);
    }
    .map-tip .tip-title { font-weight: 600; color: var(--accent); }
    .map-tip .tip-sub { color: #9fb6c4; }
    .modal-overlay {
      position: fixed; inset: 0; z-index: 100;
      display: flex; align-items: center; justify-content: center;
      background: rgba(0, 0, 0, 0.6); padding: 20px;
    }
    .modal {
      background: #061622; border: 1px solid var(--accent-dim);
      border-radius: 10px; width: 100%; max-width: 560px;
      max-height: 85vh; display: flex; flex-direction: column;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
    }
    .modal-head {
      display: flex; align-items: center; gap: 10px;
      padding: 14px 18px; border-bottom: 1px solid var(--accent-dim);
    }
    .modal-head h2 { margin: 0; flex: 1; font-size: 1.1rem; }
    .modal-body { padding: 8px 18px 18px; overflow-y: auto; }
    .go-summary { font-size: 1rem; margin: 4px 0 14px; }
    .go-standings { display: flex; flex-direction: column; gap: 6px; }
    .go-row {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 10px; border-radius: 6px; background: #04161f;
    }
    .go-dot { width: 12px; height: 12px; border-radius: 50%; flex: none; }
    .go-name { flex: 1; }
    .go-data { color: var(--accent); font-variant-numeric: tabular-nums; }
    .go-hull { opacity: 0.7; min-width: 78px; text-align: right; }
    .help-section h3 {
      margin: 16px 0 6px; font-size: 0.95rem; color: var(--accent);
    }
    .help-intro { color: var(--muted); font-size: 0.85rem; margin: 4px 0 0; }
    .help-row {
      display: flex; gap: 12px; align-items: baseline;
      padding: 6px 0; border-bottom: 1px solid rgba(60, 204, 255, 0.08);
    }
    .help-glyph {
      flex: 0 0 26px; text-align: center; font-size: 1.15rem;
    }
    .help-name { flex: 0 0 96px; font-weight: 600; font-size: 0.85rem; }
    .help-desc { flex: 1; color: #b9cdd8; font-size: 0.82rem; line-height: 1.4; }
    .room-code {
      font-family: "SF Mono", Menlo, Consolas, monospace;
      font-size: 1.4rem;
      letter-spacing: 0.2em;
      color: var(--accent);
    }
    ul.players { list-style: none; margin: 0; padding: 0; }
    ul.players li {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      border-radius: 6px;
      background: #02090f;
      margin-bottom: 6px;
    }
    .badge {
      font-size: 0.7rem;
      padding: 2px 6px;
      border-radius: 4px;
      background: var(--accent-dim);
      color: var(--text);
    }
    .badge.host { background: #b8860b; color: #02090f; }
    .badge.ready { background: var(--ok); color: #02090f; }
    .badge.offline { background: #444; color: #aaa; }
    .badge.bot { background: #6f42c1; color: #f4eefb; }
    .pname { flex: 1; }
    .swatch { width: 12px; height: 12px; border-radius: 3px; }
    canvas#board {
      width: 100%;
      height: auto;
      display: block;
      background: #02090f;
      border: 1px solid var(--accent-dim);
      border-radius: 8px;
      image-rendering: auto;
      margin-bottom: 12px;
    }
    #log {
      font-family: "SF Mono", Menlo, Consolas, monospace;
      font-size: 0.74rem;
      background: #02090f;
      border-radius: 8px;
      padding: 12px;
      height: 150px;
      overflow-y: auto;
      white-space: pre-wrap;
      line-height: 1.5;
    }
    .log-in { color: var(--accent); }
    .log-out { color: #8fd694; }
    .log-sys { color: #b0b0b0; }
    .log-err { color: var(--err); }
    .toast {
      color: var(--err);
      font-size: 0.85rem;
      min-height: 1.2em;
      margin-top: 8px;
    }

    /* --- register programming --- */
    #program { margin-bottom: 4px; }
    .prog-head {
      display: flex; justify-content: space-between; align-items: baseline;
      font-size: 0.9rem; color: var(--accent); margin-bottom: 8px;
    }
    .ping-timer {
      font-family: "SF Mono", Menlo, Consolas, monospace;
      font-size: 0.85rem; color: var(--accent); padding: 1px 8px;
      border: 1px solid var(--accent-dim); border-radius: 10px;
      margin-right: 10px;
    }
    .ping-timer.urgent { color: var(--err); border-color: var(--err); }
    .sonar-btn {
      font-size: 0.78rem; margin-left: 10px; padding: 3px 12px;
      border: 1px solid var(--accent-dim); border-radius: 12px;
      background: #02090f; color: var(--muted); cursor: pointer;
      vertical-align: middle;
    }
    .sonar-btn.active {
      color: #ffd45e; border-color: #ffd45e;
      box-shadow: 0 0 10px rgba(255, 212, 94, 0.4);
    }
    .hand-label { margin: 2px 0 6px; }
    .slots { display: flex; gap: 8px; margin-bottom: 12px; }
    .slot {
      flex: 1; aspect-ratio: 3 / 4; min-height: 56px;
      border: 1px dashed var(--accent-dim); border-radius: 8px;
      background: #02090f; color: var(--text);
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 2px; cursor: pointer;
      font-size: 0.72rem; text-align: center; padding: 4px;
      transition: border-color 0.15s, background 0.15s,
                  box-shadow 0.15s, transform 0.15s;
    }
    .slot .idx { color: var(--muted); font-size: 0.62rem; }
    .slot.filled { border-style: solid; border-color: var(--accent); }
    .slot .glyph { font-size: 1.1rem; line-height: 1; }
    .slot.locked { opacity: 0.7; cursor: default; }
    .slot.executing {
      opacity: 1; border-style: solid; border-color: #ffd24a;
      box-shadow: 0 0 14px #ffd24a, inset 0 0 8px rgba(255,210,74,0.35);
      transform: scale(1.08);
    }
    .palette { display: flex; flex-wrap: wrap; gap: 6px; }
    .card-btn {
      font-size: 0.74rem; padding: 6px 8px; line-height: 1.15;
      display: flex; flex-direction: column; align-items: center; gap: 1px;
      min-width: 60px;
    }
    .card-btn .glyph { font-size: 1rem; }
    .card-btn.used { opacity: 0.32; }
    #program.locked .palette, #program.locked .slots { pointer-events: none; opacity: 0.6; }

    /* --- Phase 10 polish: HUD, sound, status panel --- */
    .sound-btn {
      font-size: 0.78rem; margin-left: 8px; padding: 3px 10px;
      border: 1px solid var(--accent-dim); border-radius: 12px;
      background: #02090f; color: var(--muted); cursor: pointer;
      vertical-align: middle;
    }
    .sound-btn.on { color: var(--accent); border-color: var(--accent); }
    .phase-pill {
      display: inline-block; margin-left: 8px; padding: 2px 10px;
      font-size: 0.72rem; letter-spacing: 0.04em; border-radius: 12px;
      background: #02121b; border: 1px solid var(--accent-dim);
      color: var(--muted); vertical-align: middle;
      transition: color 0.2s, border-color 0.2s, box-shadow 0.2s;
    }
    .phase-pill.resolving {
      color: #ffd24a; border-color: #ffd24a;
      box-shadow: 0 0 10px rgba(255,210,74,0.35);
    }
    .phase-pill.programming { color: var(--accent); border-color: var(--accent); }
    .phase-pill.waiting { color: var(--muted); }
    /* richer fleet status rows */
    ul.players li.pdead { opacity: 0.55; }
    ul.players li.pme { box-shadow: inset 0 0 0 1px rgba(255,255,255,0.18); }
    .swatch.tag {
      display: inline-flex; align-items: center; justify-content: center;
      width: 16px; height: 16px; border-radius: 4px;
      font-size: 0.62rem; font-weight: 700; color: #02090f;
    }
    .pstat { display: flex; gap: 6px; align-items: center; }
    .pill {
      font-size: 0.66rem; padding: 1px 6px; border-radius: 8px;
      background: #02121b; border: 1px solid var(--accent-dim);
      color: var(--muted); font-variant-numeric: tabular-nums;
    }
    .pill.data { color: var(--accent); border-color: var(--accent-dim); }
    .pill.deep { color: #9db8ff; }
    .hullbar {
      width: 46px; height: 6px; border-radius: 3px;
      background: rgba(0,0,0,0.5); overflow: hidden; flex: 0 0 auto;
    }
    .hullbar > span { display: block; height: 100%; }
  </style>
</head>
<body>
  <header>
    <h1>Submarine Trench War</h1>
    <div class="subtitle">Phase 10 &mdash; polish, audio &amp; UX</div>
  </header>

  <main>
    <div id="helpModal" class="modal-overlay hidden">
      <div class="modal">
        <div class="modal-head">
          <h2>How to Play</h2>
          <button id="btnHelpClose">Close</button>
        </div>
        <div class="modal-body" id="helpBody"></div>
      </div>
    </div>

    <div id="gameOverModal" class="modal-overlay hidden">
      <div class="modal">
        <div class="modal-head">
          <h2 id="gameOverTitle">Match Over</h2>
          <button id="btnGameOverClose">Close</button>
        </div>
        <div class="modal-body" id="gameOverBody"></div>
      </div>
    </div>

    <div class="panel">
      <div class="status-row">
        <span class="dot" id="statusDot"></span>
        <span id="statusText">Disconnected</span>
        <span style="flex:1"></span>
        <span id="whoami" class="subtitle"></span>
      </div>
    </div>

    <!-- HOME: create or join -->
    <div class="panel" id="viewHome">
      <h2>Set Sail</h2>
      <div class="field">
        <label for="nameInput">Captain name</label>
        <input id="nameInput" type="text" placeholder="Nautilus" maxlength="20" />
      </div>
      <div class="controls" style="margin-bottom: 14px;">
        <button id="btnCreate" class="primary">Create Room</button>
      </div>
      <div class="field">
        <label for="mapSelect">Map</label>
        <select id="mapSelect">
          <option value="trench_alpha">Trench Alpha</option>
          <option value="trench_beta">Trench Bravo</option>
        </select>
      </div>
      <div class="field">
        <label for="roomInput">Join with room code</label>
        <div class="controls">
          <input id="roomInput" type="text" placeholder="REEF12" maxlength="6"
                 style="text-transform: uppercase;" />
          <button id="btnJoin">Join Room</button>
        </div>
      </div>
      <div class="toast" id="homeToast"></div>
    </div>

    <!-- LOBBY: room + players -->
    <div class="panel hidden" id="viewLobby">
      <h2>Wardroom</h2>
      <div class="field">
        <label>Room code (share with your fleet)</label>
        <span class="room-code" id="roomCode">------</span>
      </div>
      <ul class="players" id="playerList"></ul>
      <div class="controls" style="margin-top: 12px;">
        <button id="btnReady">Ready Up</button>
        <button id="btnAddBot" class="hidden">Add Bot</button>
        <button id="btnStart" class="primary hidden">Dive! (Start)</button>
        <button id="btnLeave">Leave</button>
      </div>
      <div class="toast" id="lobbyToast"></div>
    </div>

    <!-- GAME: board + fleet -->
    <div class="panel hidden" id="viewGame">
      <h2>Match In Progress <span id="roundTag" class="badge">Round 1</span>
        <span id="phasePill" class="phase-pill">Standby</span>
        <button id="btnSonar" class="sonar-btn" title="Toggle active/passive sonar">Sonar: Passive</button>
        <button id="btnSound" class="sound-btn" title="Toggle sound effects" aria-pressed="false">🔈 Sound</button>
      </h2>
      <canvas id="board" width="600" height="360"></canvas>
      <div id="mapTip" class="map-tip hidden"></div>

      <!-- Register programming -->
      <div id="program">
        <div class="prog-head">
          <span>Draft 5 cards into your registers</span>
          <span style="flex:1"></span>
          <span id="pingTimer" class="ping-timer hidden">30s</span>
          <span id="lockTally" class="subtitle">0 / 0 locked</span>
        </div>
        <div class="slots" id="slots"></div>
        <div class="hand-label subtitle">Your hand</div>
        <div class="palette" id="palette"></div>
        <div class="controls" style="margin-top: 10px;">
          <button id="btnHelp" title="How to play">? Help</button>
          <button id="btnClear">Clear</button>
          <button id="btnLock" class="primary" disabled>Lock In</button>
          <span id="progToast" class="subtitle" style="flex:1"></span>
        </div>
      </div>

      <ul class="players" id="gamePlayers" style="margin-top: 12px;"></ul>
      <div class="controls" style="margin-top: 12px;">
        <button id="btnLeaveGame">Leave Match</button>
      </div>
    </div>

    <div class="panel">
      <h2>Console</h2>
      <div id="log" aria-live="polite"></div>
    </div>
  </main>

  <script>
    "use strict";

    const LS_TOKEN = "stw_session_token";
    const LS_NAME = "stw_display_name";
    const LS_SOUND = "stw_sound_on";

    const state = {
      ws: null,
      seq: 0,
      connected: false,
      playerId: null,
      token: localStorage.getItem(LS_TOKEN) || null,
      roomCode: null,
      isHost: false,
      view: "home",     // home | lobby | game
      lobby: null,      // last lobby_state payload
      board: null,      // { width, height, grid, legend }
      subs: [],         // [{ player_id, color, x, y, facing, depth, hull, ... }]
      round: 0,         // current round number
      cards: [],        // available card kinds this round
      program: [],      // my chosen kinds (up to 5)
      locked: false,    // have I locked this round?
      lockTally: null,  // { locked, total } from player_locked
      anim: null,       // active replay animation, or null
      hand: [],         // my dealt cards this round: [{ id, kind }]
      timerEndsAt: null,// Ping Timer deadline (epoch ms), or null
      pendingRound: null,// next-round setup buffered until a replay ends
      visibleTiles: null,// Set of "x,y" I can currently see, or null (no fog)
      inkClouds: [],    // [{ x, y }] ink clouds blocking vision
      decoys: [],       // [{ x, y }] false contacts on my scope
      collapses: [],    // [{ x, y, t0 }] in-flight trench-collapse animations
      spectator: false, // am I watching with a full-board view?
      sonarMode: "passive", // my sonar mode: passive | active
      dataNodes: [],    // [{ x, y }] data nodes I can currently see
      extraction: null, // { x, y } current extraction zone, or null
      winData: 3,       // data needed to extract
      myData: 0,        // data my sub is carrying
      gameOver: false,  // has the match ended?
      roster: {},       // player_id -> { color, display_name } (from game_started)
      // SFX on by default; only stays off if the player explicitly muted before.
      soundOn: localStorage.getItem(LS_SOUND) !== "0",
    };

    // Card metadata: label + glyph for the UI.
    const CARD_META = {
      ahead_standard: { label: "Ahead 1", glyph: "\u2191" },
      ahead_flank:    { label: "Ahead 2", glyph: "\u21c8" },
      reverse:        { label: "Reverse", glyph: "\u2193" },
      port_bank:      { label: "Port",    glyph: "\u21b0" },
      starboard_bank: { label: "Starb'd", glyph: "\u21b1" },
      dive:           { label: "Dive",    glyph: "\u2b07" },
      surface:        { label: "Surface", glyph: "\u2b06" },
      torpedo:        { label: "Torpedo", glyph: "\u27a4" },
      depth_charge:   { label: "D.Charge", glyph: "\u25c9" },
      sonar_ping:     { label: "Sonar",   glyph: "\u25cc" },
      ink_cloud:      { label: "Ink",     glyph: "\u2601" },
      decoy_torpedo:  { label: "Decoy",   glyph: "\u21dd" },
      emp_burst:      { label: "EMP",     glyph: "\u26a1" },
    };
    // Cards that actually move the sub (for the path preview).
    const MOVE_CARDS = { ahead_standard: 1, ahead_flank: 2, reverse: 1 };
    const REGISTERS = 5;

    const $ = (id) => document.getElementById(id);
    const el = {
      dot: $("statusDot"), statusText: $("statusText"), whoami: $("whoami"),
      log: $("log"),
      viewHome: $("viewHome"), viewLobby: $("viewLobby"), viewGame: $("viewGame"),
      nameInput: $("nameInput"), roomInput: $("roomInput"),
      btnCreate: $("btnCreate"), btnJoin: $("btnJoin"), mapSelect: $("mapSelect"),
      roomCode: $("roomCode"), playerList: $("playerList"),
      btnReady: $("btnReady"), btnStart: $("btnStart"), btnLeave: $("btnLeave"),
      btnAddBot: $("btnAddBot"),
      gamePlayers: $("gamePlayers"), btnLeaveGame: $("btnLeaveGame"),
      homeToast: $("homeToast"), lobbyToast: $("lobbyToast"),
      canvas: $("board"), mapTip: $("mapTip"),
      roundTag: $("roundTag"), lockTally: $("lockTally"),
      slots: $("slots"), palette: $("palette"),
      btnClear: $("btnClear"), btnLock: $("btnLock"),
      progToast: $("progToast"), program: $("program"),
      pingTimer: $("pingTimer"), btnSonar: $("btnSonar"),
      btnSound: $("btnSound"), phasePill: $("phasePill"),
      btnHelp: $("btnHelp"), btnHelpClose: $("btnHelpClose"),
      helpModal: $("helpModal"), helpBody: $("helpBody"),
      gameOverModal: $("gameOverModal"), gameOverBody: $("gameOverBody"),
      gameOverTitle: $("gameOverTitle"),
      btnGameOverClose: $("btnGameOverClose"),
    };
    const ctx = el.canvas.getContext("2d");
    // Pixel<->cell mapping from the latest board render, used for hover tooltips.
    let boardMetrics = null;
    // Timestamp of the previous animation frame, used to detect and absorb
    // long freezes (backgrounded / occluded window) so a replay resumes rather
    // than skipping ahead.
    let lastFrameT = null;

    // --- audio ----------------------------------------------------------
    // Lightweight synthesized SFX via the Web Audio API (no asset files).
    // The AudioContext is created lazily and resumed on the first user
    // gesture to satisfy browser autoplay policies. All output is gated by
    // state.soundOn so a muted player pays no cost beyond a cheap early return.
    const Sfx = (() => {
      let ac = null, master = null;
      function ensure() {
        if (ac) return ac;
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return null;
        ac = new AC();
        master = ac.createGain();
        master.gain.value = 0.5;
        master.connect(ac.destination);
        return ac;
      }
      // Resume a suspended context (called from user-gesture handlers).
      function unlock() {
        const c = ensure();
        if (c && c.state === "suspended") c.resume();
      }
      function noiseBuffer(dur) {
        const n = Math.floor(ac.sampleRate * dur);
        const buf = ac.createBuffer(1, n, ac.sampleRate);
        const d = buf.getChannelData(0);
        for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
        return buf;
      }
      // A pitched blip: oscillator gliding f0->f1 with an AR envelope.
      function tone(type, f0, f1, dur, peak, delay) {
        if (!state.soundOn) return;
        const c = ensure(); if (!c) return;
        const t0 = c.currentTime + (delay || 0);
        const o = c.createOscillator();
        const g = c.createGain();
        o.type = type;
        o.frequency.setValueAtTime(f0, t0);
        o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t0 + dur);
        g.gain.setValueAtTime(0.0001, t0);
        g.gain.exponentialRampToValueAtTime(peak, t0 + Math.min(0.03, dur * 0.3));
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
        o.connect(g); g.connect(master);
        o.start(t0); o.stop(t0 + dur + 0.02);
      }
      // A filtered noise burst for explosions / creaks / rumble.
      function noise(dur, peak, cutoff, delay) {
        if (!state.soundOn) return;
        const c = ensure(); if (!c) return;
        const t0 = c.currentTime + (delay || 0);
        const src = c.createBufferSource();
        src.buffer = noiseBuffer(dur);
        const f = c.createBiquadFilter();
        f.type = "lowpass"; f.frequency.value = cutoff || 900;
        const g = c.createGain();
        g.gain.setValueAtTime(peak, t0);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
        src.connect(f); f.connect(g); g.connect(master);
        src.start(t0); src.stop(t0 + dur + 0.02);
      }
      return {
        unlock,
        sonar()      { tone("sine", 1400, 1800, 0.28, 0.18);
                       tone("sine", 2100, 2400, 0.22, 0.10, 0.05); },
        torpedo()    { noise(0.5, 0.22, 1200); tone("sawtooth", 420, 90, 0.5, 0.14); },
        explosion()  { noise(0.55, 0.5, 700); tone("sine", 150, 40, 0.5, 0.22); },
        hit()        { noise(0.4, 0.32, 500); tone("triangle", 240, 70, 0.4, 0.18); },
        creak()      { tone("sawtooth", 90, 60, 0.7, 0.10);
                       noise(0.7, 0.06, 300); },
        mine()       { noise(0.6, 0.55, 800); tone("square", 200, 50, 0.5, 0.2); },
        emp()        { tone("square", 1200, 200, 0.35, 0.16);
                       tone("square", 900, 150, 0.35, 0.10, 0.04); },
        collapse()   { noise(1.0, 0.6, 420); tone("sine", 110, 30, 1.0, 0.24); },
        alarm()      { tone("square", 880, 880, 0.16, 0.14);
                       tone("square", 660, 660, 0.16, 0.14, 0.2); },
        lock()       { tone("sine", 660, 990, 0.14, 0.14); },
        win()        { [523, 659, 784, 1047].forEach((f, i) =>
                         tone("triangle", f, f, 0.24, 0.16, i * 0.13)); },
        lose()       { [392, 330, 262].forEach((f, i) =>
                         tone("sawtooth", f, f * 0.98, 0.34, 0.14, i * 0.18)); },
      };
    })();

    // --- logging --------------------------------------------------------
    function log(kind, text) {
      const line = document.createElement("div");
      line.className = "log-" + kind;
      line.textContent = `[${new Date().toLocaleTimeString()}] ${text}`;
      el.log.appendChild(line);
      el.log.scrollTop = el.log.scrollHeight;
    }

    // Escape user-supplied text before injecting it into innerHTML.
    function esc(s) {
      return String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
      }[c]));
    }

    // --- connection -----------------------------------------------------
    function wsUrl() {
      const proto = location.protocol === "https:" ? "wss:" : "ws:";
      return `${proto}//${location.host}/ws`;
    }

    function setConnected(connected) {
      state.connected = connected;
      el.dot.classList.toggle("connected", connected);
      el.statusText.textContent = connected ? "Connected" : "Disconnected";
    }

    function connect() {
      if (state.ws) return;
      log("sys", `Connecting to ${wsUrl()} ...`);
      const ws = new WebSocket(wsUrl());
      state.ws = ws;
      // Watchdog: if the socket doesn't finish connecting quickly, don't sit on
      // the browser's ~1 min TCP timeout. Force it closed so we retry promptly.
      // Skip this while the tab is hidden: background tabs are throttled by the
      // browser (delayed handshake / onopen), which would look like a stall and
      // trigger a needless disconnect loop.
      let watchdog = setTimeout(() => {
        if (ws.readyState === WebSocket.CONNECTING && !document.hidden) {
          log("sys", "Connection stalled, retrying ...");
          try { ws.close(); } catch (_) {}
        }
      }, 4000);
      const clearWatchdog = () => { if (watchdog) { clearTimeout(watchdog); watchdog = null; } };
      ws.onopen = () => {
        clearWatchdog();
        setConnected(true);
        const name = el.nameInput.value.trim()
          || localStorage.getItem(LS_NAME) || "Captain";
        send("hello", { protocol_version: 1, display_name: name,
                        session_token: state.token || undefined });
      };
      ws.onmessage = (e) => onMessage(e.data);
      ws.onerror = () => log("err", "WebSocket error.");
      ws.onclose = () => {
        clearWatchdog();
        setConnected(false);
        state.ws = null;
        log("sys", "Disconnected. Reconnecting in 1s ...");
        setTimeout(connect, 1000);
      };
    }

    function send(type, payload) {
      if (!state.ws || state.ws.readyState !== WebSocket.OPEN) {
        log("err", "Not connected."); return;
      }
      const msg = { type, seq: state.seq++, ts: Date.now(), payload: payload || {} };
      state.ws.send(JSON.stringify(msg));
      log("out", "\u2192 " + type);
    }

    // --- message handling ----------------------------------------------
    function onMessage(data) {
      let msg;
      try { msg = JSON.parse(data); }
      catch { log("err", "Bad JSON from server."); return; }
      log("in", "\u2190 " + msg.type);
      const p = msg.payload || {};
      switch (msg.type) {
        case "welcome": onWelcome(p); break;
        case "game_joined": onGameJoined(p); break;
        case "lobby_state": onLobbyState(p); break;
        case "game_started": onGameStarted(p); break;
        case "round_started": onRoundStarted(p); break;
        case "deal_hand": onDealHand(p); break;
        case "player_locked": onPlayerLocked(p); break;
        case "program_restored": onProgramRestored(p); break;
        case "timer_started": onTimerStarted(p); break;
        case "registers_resolving": onRegistersResolving(p); break;
        case "round_result": onRoundResult(p); break;
        case "revealed_cards": onRevealedCards(p); break;
        case "game_state": onGameState(p); break;
        case "extraction_announced": onExtractionAnnounced(p); break;
        case "map_collapse": onMapCollapse(p); break;
        case "game_over": onGameOver(p); break;
        case "error": onError(p); break;
        case "pong": break;
        default: break;
      }
    }

    function onWelcome(p) {
      const prevId = state.playerId;
      state.playerId = p.player_id;
      state.token = p.session_token;
      localStorage.setItem(LS_TOKEN, state.token);
      updateWhoami();
      log("sys", `Welcome. player_id=${p.player_id}`);
      // If we reconnected but the server handed us a *new* identity, the
      // room/game we were showing is gone (server state was wiped or our
      // session expired). Don't strand the player on a stale board.
      if (prevId && prevId !== p.player_id && state.view !== "home") {
        log("sys", "Session was replaced \u2014 returning home.");
        resetToHome();
      }
      // If the server puts us back in a room, a lobby_state/game_started
      // will follow and switch the view; otherwise we stay on home.
    }

    // Drop any in-game/lobby state and return to the home screen.
    function resetToHome() {
      state.roomCode = null;
      state.isHost = false;
      state.subs = [];
      state.board = null;
      state.lobby = null;
      state.hand = [];
      state.program = [];
      state.locked = false;
      state.anim = null;
      state.pendingRound = null;
      setView("home");
    }

    function onGameJoined(p) {
      state.roomCode = p.room_code;
      state.isHost = !!p.is_host;
      setView("lobby");
      el.roomCode.textContent = p.room_code;
      clearToast();
    }

    function onLobbyState(p) {
      state.lobby = p;
      state.roomCode = p.room_code;
      state.isHost = (p.host_id === state.playerId);
      if (p.phase === "playing") {
        // Prefer the submarines (which carry colors) over the colorless
        // lobby player list so the fleet swatches don't vanish.
        if (state.subs.length) renderGamePlayers({ players: state.subs });
        updateWhoami();
        setView("game");
      } else { renderLobby(p); if (state.view !== "lobby") setView("lobby"); }
    }

    function onGameStarted(p) {
      state.roomCode = p.room_code;
      state.gameOver = false;
      el.gameOverModal.classList.add("hidden");
      if (p.board) state.board = p.board;
      state.collapses = [];
      if (p.submarines) state.subs = p.submarines;
      // game_started is unfogged: record every player's colour + name so we
      // can label fogged sonar contacts consistently for the rest of the game.
      (p.submarines || []).forEach((s) => {
        state.roster[s.player_id] = { color: s.color, display_name: s.display_name };
      });
      renderGamePlayers({ players: p.submarines });
      updateWhoami();
      setView("game");
      log("sys", "Game started.");
    }

    function onRoundStarted(p) {
      // While the previous round's replay is still animating, buffer the
      // next-round reset so the locked cards stay visible in their slots
      // until their actions have finished playing out.
      if (state.anim) {
        state.pendingRound = state.pendingRound || {};
        state.pendingRound.started = p;
        return;
      }
      applyRoundStarted(p);
    }

    function applyRoundStarted(p) {
      state.round = p.round || state.round;
      state.program = [];
      state.locked = false;
      state.anim = null;
      state.timerEndsAt = null;
      el.pingTimer.classList.add("hidden");
      el.roundTag.textContent = "Round " + state.round;
      el.program.classList.remove("locked");
      renderSlots();
      el.progToast.textContent = "";
      log("sys", "Round " + state.round + " \u2014 draft your registers.");
    }

    function onDealHand(p) {
      if (p.player_id && p.player_id !== state.playerId) return;
      if (state.anim) {
        state.pendingRound = state.pendingRound || {};
        state.pendingRound.deal = p;
        return;
      }
      applyDealHand(p);
    }

    function applyDealHand(p) {
      state.hand = p.cards || [];
      renderPalette();
      renderSlots();
    }

    // Apply any round setup that was buffered during a replay animation.
    function flushPendingRound() {
      const pr = state.pendingRound;
      if (!pr) return;
      state.pendingRound = null;
      if (pr.started) applyRoundStarted(pr.started);
      if (pr.deal) applyDealHand(pr.deal);
    }

    function onPlayerLocked(p) {
      state.lockTally = { locked: p.locked, total: p.total };
      el.lockTally.textContent = `${p.locked} / ${p.total} locked`;
    }

    // Reconnected mid-round: the server still holds our submitted registers
    // and lock status, so restore the slots + locked UI to match instead of
    // showing a fresh, editable round.
    function onProgramRestored(p) {
      applyPendingIfAny();
      state.program = (p.registers || []).filter(
        (id) => state.hand.some((c) => c.id === id));
      if (typeof p.locked_count === "number" && typeof p.total === "number") {
        state.lockTally = { locked: p.locked_count, total: p.total };
        el.lockTally.textContent = `${p.locked_count} / ${p.total} locked`;
      }
      if (p.locked) {
        state.locked = true;
        el.program.classList.add("locked");
        el.progToast.textContent = "Locked. Waiting for the fleet\u2026";
      }
      renderSlots();
    }

    // If a replay is buffering the next round, flush it so restore applies to
    // the live round rather than the buffered one.
    function applyPendingIfAny() {
      if (state.pendingRound) flushPendingRound();
    }

    function onTimerStarted(p) {
      state.timerEndsAt = p.ends_at || (Date.now() + (p.duration_ms || 30000));
      el.pingTimer.classList.remove("hidden");
      log("sys", "Ping Timer started.");
    }

    function onRegistersResolving(p) {
      state.timerEndsAt = null;
      el.pingTimer.classList.add("hidden");
      const auto = (p.auto_filled || []);
      if (auto.includes(state.playerId)) {
        el.progToast.textContent = "Timer expired \u2014 registers auto-filled!";
      }
    }

    function onRoundResult(p) {
      state.timerEndsAt = null;
      el.pingTimer.classList.add("hidden");
      // Consumed mines are gone: scrub them from the local board grid.
      (p.mines_cleared || []).forEach((m) => clearMineTile(m.x, m.y));
      // Replay the phases, then settle on the authoritative final subs.
      const finalSubs = p.submarines || state.subs;
      startReplay(p.phases || [], finalSubs);
      logCombat(p.phases || []);
      log("sys", "Round " + p.round + " resolved (" +
        (p.phases ? p.phases.length : 0) + " phases).");
    }

    // Replace a mine tile ("M") with open trench (".") in the local grid.
    function clearMineTile(x, y) {
      const b = state.board;
      if (!b || !b.grid || !b.grid[y]) return;
      const row = b.grid[y];
      if ((row[x] || "") === "M") {
        b.grid[y] = row.slice(0, x) + "." + row.slice(x + 1);
      }
    }

    // Summarise notable combat events from a resolved round into the log.
    function logCombat(phases) {
      const nameOf = (id) => {
        const s = (state.subs || []).find((x) => x.player_id === id);
        return s ? (s.display_name || id) : id;
      };
      phases.forEach((ph) => (ph.events || []).forEach((ev) => {
        if (ev.type === "hit") {
          log("sys", nameOf(ev.player_id) + " took " + ev.damage +
            " from " + ev.weapon + ".");
        } else if (ev.type === "mine") {
          log("sys", nameOf(ev.player_id) + " hit a mine!");
        } else if (ev.type === "ram") {
          log("sys", nameOf(ev.player_id) + " rammed.");
        } else if (ev.type === "disabled") {
          log("sys", nameOf(ev.player_id) +
            "'s nav-computer was scrambled by an EMP.");
        } else if (ev.type === "decoy") {
          log("sys", nameOf(ev.player_id) + " launched a decoy.");
        } else if (ev.type === "destroyed") {
          log("err", nameOf(ev.player_id) + " was destroyed!");
        }
      }));
    }

    function onRevealedCards(p) {
      const nameOf = (id) => {
        const s = (state.subs || []).find((x) => x.player_id === id);
        return s ? (s.display_name || id) : id;
      };
      const labels = (p.registers || [])
        .map((k) => (CARD_META[k] || { label: k }).label);
      log("sys", "Sonar reveals " + nameOf(p.player_id) + ": " +
        labels.join(" \u2192 "));
    }

    function onGameState(p) {
      state.round = p.round || state.round;
      // Fog-of-war state: what can I see, and am I spectating?
      state.spectator = !!p.spectator;
      if (typeof p.sonar_mode === "string") state.sonarMode = p.sonar_mode;
      state.inkClouds = p.ink_clouds || [];
      state.decoys = p.decoys || [];
      state.dataNodes = p.data_nodes || [];
      state.extraction = p.extraction || null;
      if (typeof p.win_data === "number") state.winData = p.win_data;
      if (p.you && typeof p.you.data_collected === "number") {
        state.myData = p.you.data_collected;
      }
      if (Array.isArray(p.visible_tiles)) {
        state.visibleTiles = state.spectator
          ? null
          : new Set(p.visible_tiles.map((c) => c.x + "," + c.y));
      }
      updateSonarButton();
      if (p.submarines) {
        // Don't clobber an in-flight replay; it sets subs at the end.
        if (!state.anim) state.subs = p.submarines;
        renderGamePlayers({ players: p.submarines });
        updateWhoami();
      }
      el.roundTag.textContent = "Round " + state.round +
        (state.spectator ? "" : "  \u00b7  Data " + state.myData + "/" + state.winData);
    }

    // A submarine has collected enough data to extract: revealed to all.
    function onExtractionAnnounced(p) {
      const s = (state.subs || []).find((x) => x.player_id === p.player_id);
      const nm = s ? (s.display_name || p.player_id) :
        (state.roster[p.player_id] || {}).display_name || p.player_id;
      Sfx.alarm();
      log("warn", "\u26a0 " + nm + " is extraction-ready (" +
        p.data_collected + " data) \u2014 position revealed!");
    }

    // The trench is evolving: sections cave in and become impassable rock.
    // Update the local grid so movement/pathing reflects the new walls, and
    // queue a short cave-in animation on each affected tile.
    function onMapCollapse(p) {
      const tiles = p.tiles || [];
      tiles.forEach((c) => {
        collapseTile(c.x, c.y);
        state.collapses.push({ x: c.x, y: c.y, t0: null });
      });
      if (tiles.length) {
        Sfx.collapse();
        log("warn", "\u26a0 Trench collapse! " + tiles.length +
          " section(s) caved in.");
      }
    }

    // Turn a tile to wall ("#") in the local grid after a collapse.
    function collapseTile(x, y) {
      const b = state.board;
      if (!b || !b.grid || !b.grid[y]) return;
      const row = b.grid[y];
      b.grid[y] = row.slice(0, x) + "#" + row.slice(x + 1);
    }

    // The match has ended. Show the standings and the winner.
    function onGameOver(p) {
      state.gameOver = true;
      const winId = p.winner;
      const you = state.playerId;
      let title;
      if (p.reason === "draw" || !winId) title = "Mutual Destruction";
      else if (winId === you) title = "Victory!";
      else title = "Defeat";
      el.gameOverTitle.textContent = title;
      if (p.reason === "draw" || !winId) Sfx.lose();
      else if (winId === you) Sfx.win();
      else Sfx.lose();

      const reasonText = {
        extracted: "extracted the black-box data",
        survivor: "was the last submarine running",
        draw: "no submarines survived",
      }[p.reason] || p.reason || "";
      const winName = winId
        ? ((state.roster[winId] || {}).display_name || winId)
        : "No one";
      const rows = (p.standings || []).map((st) => {
        const me = st.player_id === you ? " (you)" : "";
        const crown = st.player_id === winId ? " \u265b" : "";
        return '<div class="go-row">' +
          '<span class="go-dot" style="background:' + st.color + '"></span>' +
          '<span class="go-name">' + esc(st.display_name) + me + crown + '</span>' +
          '<span class="go-data">Data ' + st.data_collected + '</span>' +
          '<span class="go-hull">' +
            (st.alive ? ("Hull " + st.hull) : "destroyed") + '</span>' +
          '</div>';
      }).join("");
      el.gameOverBody.innerHTML =
        '<p class="go-summary"><strong>' + esc(winName) + '</strong> ' +
        esc(reasonText) + '.</p>' +
        '<div class="go-standings">' + rows + '</div>';
      el.gameOverModal.classList.remove("hidden");
    }

    function onError(p) {
      log("err", `error[${p.code}] ${p.message}`);
      // If we tried to act on a game the server no longer has us in, the
      // board on screen is stale. Bail back home instead of hanging.
      if (p.code === "not_in_game" && state.view !== "home") {
        resetToHome();
        el.homeToast.textContent = "That game is no longer available.";
        setTimeout(() => { el.homeToast.textContent = ""; }, 4000);
        return;
      }
      const target = state.view === "home" ? el.homeToast : el.lobbyToast;
      target.textContent = friendlyError(p.code, p.message);
      setTimeout(() => { target.textContent = ""; }, 4000);
    }

    // Turn a terse server error code into player-facing guidance.
    function friendlyError(code, message) {
      const map = {
        room_not_found: "No room with that code \u2014 check the letters and try again.",
        room_full: "That room is full. Ask the host to make space or start a new one.",
        not_host: "Only the host can start the match.",
        no_identity: "Session hiccup \u2014 reconnecting\u2026",
        invalid_register: "That set of cards isn't valid \u2014 pick from your current hand.",
        already_locked: "Your registers are already locked for this round.",
        not_your_turn_phase: "You can't do that right now \u2014 wait for the next phase.",
        rate_limited: "Slow down a moment \u2014 too many actions at once.",
        protocol_version_unsupported:
          "This client is out of date. Refresh the page to update.",
        bad_json: "The server didn't understand that request.",
        internal_error: "The server hit a snag. Please try again.",
      };
      return map[code] || message || code;
    }

    function clearToast() {
      el.homeToast.textContent = ""; el.lobbyToast.textContent = "";
    }

    // --- rendering ------------------------------------------------------
    function setView(view) {
      state.view = view;
      el.viewHome.classList.toggle("hidden", view !== "home");
      el.viewLobby.classList.toggle("hidden", view !== "lobby");
      el.viewGame.classList.toggle("hidden", view !== "game");
    }

    function renderLobby(p) {
      el.roomCode.textContent = p.room_code || "------";
      el.playerList.innerHTML = "";
      let me = null;
      (p.players || []).forEach((pl) => {
        if (pl.player_id === state.playerId) me = pl;
        const li = document.createElement("li");
        const name = document.createElement("span");
        name.className = "pname";
        name.textContent = pl.display_name;
        li.appendChild(name);
        if (pl.player_id === p.host_id) li.appendChild(badge("host", "HOST"));
        if (pl.bot) li.appendChild(badge("bot", "BOT"));
        if (pl.ready) li.appendChild(badge("ready", "READY"));
        if (!pl.bot && !pl.connected) li.appendChild(badge("offline", "OFFLINE"));
        el.playerList.appendChild(li);
      });
      el.btnReady.textContent = (me && me.ready) ? "Not Ready" : "Ready Up";
      const players = p.players || [];
      const allReady =
        players.length >= 2 && players.every((x) => x.ready || !x.connected);
      el.btnStart.classList.toggle("hidden", !state.isHost);
      el.btnStart.disabled = !(state.isHost && allReady);
      // Host-only: add a computer opponent while there is room in the fleet.
      const full = players.length >= (p.max_players || 4);
      el.btnAddBot.classList.toggle("hidden", !state.isHost);
      el.btnAddBot.disabled = !(state.isHost && !full);
    }

    function renderGamePlayers(p) {
      el.gamePlayers.innerHTML = "";
      (p.players || []).forEach((pl, i) => {
        const li = document.createElement("li");
        const dead = pl.alive === false;
        const me = pl.player_id === state.playerId;
        if (dead) li.classList.add("pdead");
        if (me) li.classList.add("pme");

        // colour swatch doubles as a shape/letter tag (a second, non-colour
        // channel) so colourblind players can still tell fleets apart.
        const sw = document.createElement("span");
        sw.className = "swatch tag";
        if (pl.color) sw.style.background = pl.color;
        sw.textContent = (pl.display_name || pl.player_id || "?")
          .trim().charAt(0).toUpperCase() || String(i + 1);
        li.appendChild(sw);

        const name = document.createElement("span");
        name.className = "pname";
        name.textContent = (pl.display_name || pl.player_id) + (me ? " (you)" : "");
        li.appendChild(name);

        const stat = document.createElement("span");
        stat.className = "pstat";
        if (dead) {
          stat.appendChild(pill("", "destroyed"));
        } else {
          if (typeof pl.data_collected === "number") {
            stat.appendChild(pill("data", "\u25c8 " + pl.data_collected));
          }
          if (pl.depth === "deep") stat.appendChild(pill("deep", "\u2b07 deep"));
          if (typeof pl.hull === "number") stat.appendChild(hullBar(pl.hull));
        }
        li.appendChild(stat);
        el.gamePlayers.appendChild(li);
      });
    }

    // A small labelled status pill.
    function pill(cls, text) {
      const s = document.createElement("span");
      s.className = "pill" + (cls ? " " + cls : "");
      s.textContent = text;
      return s;
    }

    // A compact hull bar coloured by remaining integrity.
    function hullBar(hull) {
      const frac = Math.max(0, Math.min(1, hull / 10));
      const wrap = document.createElement("span");
      wrap.className = "hullbar";
      wrap.title = "Hull " + hull + "/10";
      const fill = document.createElement("span");
      fill.style.width = Math.round(frac * 100) + "%";
      fill.style.background =
        frac > 0.5 ? "#12b886" : frac > 0.25 ? "#e0a020" : "#e05555";
      wrap.appendChild(fill);
      return wrap;
    }

    // Reflect the current stage of play in the header phase pill.
    function updatePhasePill() {
      const pillEl = el.phasePill;
      if (!pillEl) return;
      let text, cls;
      if (state.gameOver) { text = "Match over"; cls = "waiting"; }
      else if (state.anim) {
        const total = state.anim.frames.length - 1;
        const seg = Math.min((state.anim.seg || 0) + 1, total);
        text = "Resolving \u00b7 Reg " + seg + "/" + total;
        cls = "resolving";
      } else if (state.spectator) { text = "Spectating"; cls = "waiting"; }
      else if (state.locked) { text = "Locked \u2014 waiting"; cls = "waiting"; }
      else if (state.round > 0) { text = "Programming"; cls = "programming"; }
      else { text = "Standby"; cls = "waiting"; }
      pillEl.textContent = text;
      pillEl.className = "phase-pill " + cls;
    }

    // --- register programming -------------------------------------------
    // state.hand = [{ id, kind }]; state.program = ordered card IDs.
    function kindOfCard(id) {
      const c = state.hand.find((c) => c.id === id);
      return c ? c.kind : null;
    }

    function renderPalette() {
      el.palette.innerHTML = "";
      state.hand.forEach((card) => {
        const meta = CARD_META[card.kind] || { label: card.kind, glyph: "?" };
        const used = state.program.includes(card.id);
        const b = document.createElement("button");
        b.className = "card-btn" + (used ? " used" : "");
        b.innerHTML =
          `<span class="glyph">${meta.glyph}</span><span>${meta.label}</span>`;
        b.title = card.kind;
        b.disabled = used || state.locked;
        b.addEventListener("click", () => addCard(card.id));
        el.palette.appendChild(b);
      });
    }

    function renderSlots() {
      el.slots.innerHTML = "";
      for (let i = 0; i < REGISTERS; i++) {
        const id = state.program[i];
        const kind = id ? kindOfCard(id) : null;
        const slot = document.createElement("div");
        slot.className = "slot" + (kind ? " filled" : "") +
          (state.locked ? " locked" : "");
        if (kind) {
          const meta = CARD_META[kind] || { label: kind, glyph: "?" };
          slot.innerHTML = `<span class="idx">${i + 1}</span>` +
            `<span class="glyph">${meta.glyph}</span><span>${meta.label}</span>`;
          if (!state.locked) slot.addEventListener("click", () => removeCard(i));
        } else {
          slot.innerHTML = `<span class="idx">${i + 1}</span>` +
            `<span style="opacity:.4">hold</span>`;
        }
        el.slots.appendChild(slot);
      }
      renderPalette();
      updateLockButton();
    }

    function addCard(id) {
      if (state.locked) return;
      if (state.program.length >= REGISTERS) return;
      if (state.program.includes(id)) return;
      state.program.push(id);
      renderSlots();
    }

    function removeCard(i) {
      if (state.locked) return;
      state.program.splice(i, 1);
      renderSlots();
    }

    function updateLockButton() {
      el.btnLock.disabled = state.locked;
      el.btnLock.textContent = "Lock In";
      el.btnLock.title = state.program.length === 0
        ? "No cards queued \u2014 lock in to pass (hold position this round)"
        : "";
    }

    function lockRegisters() {
      if (state.locked) return;
      send("program_registers", { registers: state.program.slice() });
      send("lock_registers", {});
      Sfx.lock();
      state.locked = true;
      el.program.classList.add("locked");
      el.progToast.textContent = "Locked. Waiting for the fleet\u2026";
      renderSlots();
    }

    // Flip between passive and active sonar. Active widens vision but the
    // server broadcasts our position to every other player.
    function toggleSonar() {
      if (state.spectator) return;
      const next = state.sonarMode === "active" ? "passive" : "active";
      state.sonarMode = next;
      updateSonarButton();
      send("set_sonar_mode", { mode: next });
    }

    function updateSonarButton() {
      const active = state.sonarMode === "active";
      el.btnSonar.textContent = "Sonar: " + (active ? "Active" : "Passive");
      el.btnSonar.classList.toggle("active", active);
      el.btnSonar.classList.toggle("hidden", state.spectator);
    }

    function toggleSound() {
      state.soundOn = !state.soundOn;
      localStorage.setItem(LS_SOUND, state.soundOn ? "1" : "0");
      updateSoundButton();
      if (state.soundOn) { Sfx.unlock(); Sfx.lock(); }
    }

    function updateSoundButton() {
      const on = state.soundOn;
      el.btnSound.textContent = (on ? "\ud83d\udd0a" : "\ud83d\udd08") + " Sound";
      el.btnSound.classList.toggle("on", on);
      el.btnSound.setAttribute("aria-pressed", on ? "true" : "false");
    }

    // --- board rendering -----------------------------------------------
    const TILE = {
      "#": { fill: "#0a2233" },   // wall
      ".": { fill: "#04161f" },   // trench
      "S": { fill: "#062a38" },   // spawn
      "D": { fill: "#04161f" },   // data node
      "X": { fill: "#04161f" },   // extraction
      "M": { fill: "#04161f" },   // mine
      "V": { fill: "#04161f" },   // vent
    };
    const FACING_ANGLE = { N: -Math.PI / 2, E: 0, S: Math.PI / 2, W: Math.PI };

    function renderBoard(t) {
      const b = state.board;
      const cv = el.canvas, g = ctx;
      g.clearRect(0, 0, cv.width, cv.height);
      if (!b || !b.grid) return;
      const size = Math.floor(Math.min(cv.width / b.width, cv.height / b.height));
      const ox = Math.floor((cv.width - size * b.width) / 2);
      const oy = Math.floor((cv.height - size * b.height) / 2);
      boardMetrics = { ox, oy, size, width: b.width, height: b.height };

      for (let y = 0; y < b.height; y++) {
        const row = b.grid[y] || "";
        for (let x = 0; x < b.width; x++) {
          const ch = row[x] || "#";
          const px = ox + x * size, py = oy + y * size;
          g.fillStyle = (TILE[ch] || TILE["."]).fill;
          g.fillRect(px, py, size, size);
          g.strokeStyle = "rgba(60,204,255,0.05)";
          g.strokeRect(px + 0.5, py + 0.5, size, size);
          drawFeature(g, ch, px, py, size, t);
        }
      }

      drawAmbient(g, ox, oy, size, t);
      drawFog(g, ox, oy, size, t);
      drawObjectives(g, ox, oy, size, t);
      drawDecoys(g, ox, oy, size, t);
      drawCollapses(g, ox, oy, size, t);

      const subs = state.anim ? animatedSubs(t) : state.subs;
      if (!state.anim) drawGhostPath(g, ox, oy, size);
      subs.forEach((s) => drawSub(g, s, ox, oy, size, t));
      if (state.anim) drawPhaseFX(g, ox, oy, size, t, subs);
    }

    // Ambient trench atmosphere: a depth gradient (darker/bluer toward the
    // seabed), a soft light shaft from the surface, and drifting motes/bubbles.
    // Purely decorative and drawn between the tiles and the fog layer.
    let particles = null;
    let particleDims = null;
    function ensureParticles(w, h) {
      const key = w + "x" + h;
      if (particleDims === key && particles) return;
      particleDims = key;
      const n = Math.round(w * h / 9);
      particles = [];
      for (let i = 0; i < n; i++) {
        particles.push({
          x: Math.random() * w,
          y: Math.random() * h,
          r: 0.04 + Math.random() * 0.06,   // radius in cells
          spd: 0.15 + Math.random() * 0.35, // rise speed (cells/sec)
          amp: 0.1 + Math.random() * 0.3,   // horizontal wobble amplitude
          ph: Math.random() * Math.PI * 2,  // wobble phase
        });
      }
    }

    let ambientLast = null;
    function drawAmbient(g, ox, oy, size, t) {
      const b = state.board;
      const W = b.width * size, H = b.height * size;
      // depth tint
      const grd = g.createLinearGradient(0, oy, 0, oy + H);
      grd.addColorStop(0, "rgba(30,90,130,0.10)");
      grd.addColorStop(1, "rgba(0,6,14,0.55)");
      g.fillStyle = grd;
      g.fillRect(ox, oy, W, H);
      // surface light shaft
      const lg = g.createRadialGradient(
        ox + W * 0.5, oy - H * 0.15, size,
        ox + W * 0.5, oy - H * 0.15, H * 1.1);
      lg.addColorStop(0, "rgba(120,200,255,0.10)");
      lg.addColorStop(1, "rgba(120,200,255,0)");
      g.fillStyle = lg;
      g.fillRect(ox, oy, W, H);
      // bubbles / motes
      ensureParticles(b.width, b.height);
      const dt = ambientLast === null ? 0 : Math.min(0.1, (t - ambientLast) / 1000);
      ambientLast = t;
      g.save();
      g.fillStyle = "rgba(150,220,255,0.35)";
      for (const p of particles) {
        p.y -= p.spd * dt;
        if (p.y < -0.1) { p.y = b.height + 0.1; p.x = Math.random() * b.width; }
        const wob = Math.sin(t / 1000 + p.ph) * p.amp;
        const px = ox + (p.x + wob) * size;
        const py = oy + p.y * size;
        g.globalAlpha = 0.15 + 0.25 * (0.5 + 0.5 * Math.sin(t / 700 + p.ph));
        g.beginPath();
        g.arc(px, py, p.r * size, 0, Math.PI * 2);
        g.fill();
      }
      g.restore();
      g.globalAlpha = 1;
    }

    // Shade every tile the player can't currently see, then draw ink clouds
    // on top. Spectators (visibleTiles === null) see the whole board.
    function drawFog(g, ox, oy, size, t) {
      const b = state.board;
      if (state.visibleTiles) {
        g.save();
        g.fillStyle = "rgba(2,10,16,0.82)";
        for (let y = 0; y < b.height; y++) {
          for (let x = 0; x < b.width; x++) {
            if (!state.visibleTiles.has(x + "," + y)) {
              g.fillRect(ox + x * size, oy + y * size, size, size);
            }
          }
        }
        g.restore();
      }
      const swirl = 0.5 + 0.5 * Math.sin(t / 500);
      (state.inkClouds || []).forEach((c) => {
        const cx = ox + c.x * size + size / 2, cy = oy + c.y * size + size / 2;
        g.save();
        g.fillStyle = `rgba(20,10,40,${0.72 + 0.15 * swirl})`;
        g.beginPath();
        g.arc(cx, cy, size * 0.55, 0, Math.PI * 2);
        g.fill();
        g.fillStyle = `rgba(90,60,150,${0.35 + 0.2 * swirl})`;
        g.beginPath();
        g.arc(cx, cy, size * 0.3, 0, Math.PI * 2);
        g.fill();
        g.restore();
      });
    }

    // Draw the objective layer above the fog: data nodes revealed within
    // sonar range (cyan diamonds) and the patrolling extraction zone (green
    // target). Both are sent dynamically per player, not baked into the grid.
    function drawObjectives(g, ox, oy, size, t) {
      const pulse = 0.6 + 0.4 * Math.sin(t / 400);
      const r = size * 0.28;
      (state.dataNodes || []).forEach((c) => {
        const cx = ox + c.x * size + size / 2, cy = oy + c.y * size + size / 2;
        g.save();
        g.translate(cx, cy);
        g.rotate(Math.PI / 4);
        g.fillStyle = `rgba(60,204,255,${0.55 * pulse + 0.3})`;
        g.fillRect(-r, -r, r * 2, r * 2);
        g.restore();
      });
      const ex = state.extraction;
      if (ex) {
        const px = ox + ex.x * size, py = oy + ex.y * size;
        const cx = px + size / 2, cy = py + size / 2;
        g.save();
        g.strokeStyle = `rgba(76,175,80,${0.6 + 0.4 * pulse})`;
        g.lineWidth = 2;
        g.strokeRect(px + size * 0.18, py + size * 0.18, size * 0.64, size * 0.64);
        g.beginPath();
        g.arc(cx, cy, r * 0.6, 0, Math.PI * 2);
        g.stroke();
        g.restore();
      }
    }

    // Draw decoy contacts: false sonar signatures planted by enemies. They
    // mimic a submarine blip (a faint ringed dot) to bait the player into
    // chasing or firing at a phantom.
    function drawDecoys(g, ox, oy, size, t) {
      const pulse = 0.5 + 0.5 * Math.sin(t / 280);
      (state.decoys || []).forEach((c) => {
        const cx = ox + c.x * size + size / 2, cy = oy + c.y * size + size / 2;
        g.save();
        g.globalAlpha = 0.3 + 0.35 * pulse;
        g.fillStyle = "#e0607a";
        g.beginPath();
        g.arc(cx, cy, size * 0.24, 0, Math.PI * 2);
        g.fill();
        g.globalAlpha = 0.55;
        g.strokeStyle = "#e0607a";
        g.lineWidth = 1.5;
        g.beginPath();
        g.arc(cx, cy, size * 0.32, 0, Math.PI * 2);
        g.stroke();
        g.restore();
      });
    }

    // Animate trench collapses: a brief rock-burst on each caved-in tile that
    // fades as the debris settles. Entries are dropped once their animation
    // completes (the tile is already a permanent wall in the grid).
    function drawCollapses(g, ox, oy, size, t) {
      const DUR = 900;
      state.collapses = (state.collapses || []).filter((c) => {
        if (c.t0 === null) c.t0 = t;
        const k = (t - c.t0) / DUR;
        if (k >= 1) return false;
        const cx = ox + c.x * size + size / 2, cy = oy + c.y * size + size / 2;
        g.save();
        g.globalAlpha = 1 - k;
        g.strokeStyle = "#7a5a3a";
        g.lineWidth = 2 + 3 * (1 - k);
        g.beginPath();
        g.arc(cx, cy, size * (0.2 + 0.5 * k), 0, Math.PI * 2);
        g.stroke();
        g.fillStyle = `rgba(122,90,58,${0.6 * (1 - k)})`;
        for (let a = 0; a < Math.PI * 2; a += Math.PI / 3) {
          const rr = size * (0.15 + 0.35 * k);
          g.beginPath();
          g.arc(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr,
            size * 0.09, 0, Math.PI * 2);
          g.fill();
        }
        g.restore();
        return true;
      });
    }

    function drawFeature(g, ch, px, py, size, t) {
      const cx = px + size / 2, cy = py + size / 2, r = size * 0.28;
      const pulse = 0.6 + 0.4 * Math.sin(t / 400);
      if (ch === "M") {              // mine: red spiky dot
        g.fillStyle = "#e05555";
        g.beginPath();
        g.arc(cx, cy, r * 0.5, 0, Math.PI * 2);
        g.fill();
        g.strokeStyle = "#e05555";
        for (let a = 0; a < Math.PI * 2; a += Math.PI / 4) {
          g.beginPath();
          g.moveTo(cx + Math.cos(a) * r * 0.5, cy + Math.sin(a) * r * 0.5);
          g.lineTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r);
          g.stroke();
        }
      } else if (ch === "V") {       // vent: orange rising chevrons
        g.strokeStyle = `rgba(255,140,60,${0.5 + 0.5 * pulse})`;
        g.lineWidth = 2;
        for (let i = 0; i < 2; i++) {
          const yy = cy + r * 0.5 - i * r * 0.8;
          g.beginPath();
          g.moveTo(cx - r * 0.5, yy);
          g.lineTo(cx, yy - r * 0.5);
          g.lineTo(cx + r * 0.5, yy);
          g.stroke();
        }
      } else if (ch === "S") {       // spawn: faint dashed marker
        g.strokeStyle = "rgba(60,204,255,0.25)";
        g.setLineDash([3, 3]);
        g.strokeRect(px + size * 0.25, py + size * 0.25, size * 0.5, size * 0.5);
        g.setLineDash([]);
      }
    }

    function drawSub(g, s, ox, oy, size, t) {
      const cx = ox + s.x * size + size / 2;
      const cy = oy + s.y * size + size / 2;
      const bob = Math.sin(t / 500 + s.x + s.y) * size * 0.04;
      const r = size * 0.34;
      const angle = FACING_ANGLE[s.facing] || 0;
      const deep = s.depth === "deep";

      // wreck: destroyed subs render as a grey hulk, no facing/depth cues
      if (s.alive === false) {
        g.save();
        g.globalAlpha = 0.6;
        g.strokeStyle = "#7a8a92";
        g.lineWidth = 2;
        g.beginPath();
        g.moveTo(cx - r * 0.7, cy - r * 0.7);
        g.lineTo(cx + r * 0.7, cy + r * 0.7);
        g.moveTo(cx + r * 0.7, cy - r * 0.7);
        g.lineTo(cx - r * 0.7, cy + r * 0.7);
        g.stroke();
        g.fillStyle = "rgba(122,138,146,0.35)";
        g.beginPath();
        g.arc(cx, cy, r * 0.9, 0, Math.PI * 2);
        g.fill();
        g.restore();
        return;
      }

      // pulsing highlight ring marks the player's own sub
      if (s.player_id === state.playerId) {
        const pulse = 0.5 + 0.5 * Math.sin(t / 300);
        g.save();
        g.globalAlpha = 0.35 + 0.4 * pulse;
        g.strokeStyle = "#ffffff";
        g.lineWidth = 2;
        g.beginPath();
        g.arc(cx, cy + bob, r * 1.45, 0, Math.PI * 2);
        g.stroke();
        g.restore();
      }

      // depth ring: dashed when deep, solid when shallow
      g.strokeStyle = s.color || "#3cf";
      g.lineWidth = 2;
      g.globalAlpha = deep ? 0.5 : 0.9;
      g.setLineDash(deep ? [3, 3] : []);
      g.beginPath();
      g.arc(cx, cy + bob, r * 1.15, 0, Math.PI * 2);
      g.stroke();
      g.setLineDash([]);
      g.globalAlpha = 1;

      // hull body as a facing triangle
      g.save();
      g.translate(cx, cy + bob);
      g.rotate(angle);
      g.fillStyle = s.color || "#3cf";
      g.globalAlpha = deep ? 0.65 : 1;
      g.beginPath();
      g.moveTo(r, 0);
      g.lineTo(-r * 0.7, -r * 0.6);
      g.lineTo(-r * 0.7, r * 0.6);
      g.closePath();
      g.fill();
      g.restore();
      g.globalAlpha = 1;

      // hull bar underneath (only when we know the hull value)
      if (typeof s.hull === "number") {
        const frac = Math.max(0, Math.min(1, s.hull / 10));
        const bw = size * 0.6, bh = Math.max(2, size * 0.06);
        const bx = cx - bw / 2, by = cy + r * 1.3;
        g.fillStyle = "rgba(0,0,0,0.5)";
        g.fillRect(bx, by, bw, bh);
        g.fillStyle = frac > 0.5 ? "#4caf50" : frac > 0.25 ? "#e0a020" : "#e05555";
        g.fillRect(bx, by, bw * frac, bh);
      }
    }

    // Draw combat effects for the phase currently animating.
    function drawPhaseFX(g, ox, oy, size, t, subs) {
      const a = state.anim;
      if (!a || !a.phases) return;
      const ph = a.phases[a.seg];
      if (!ph || !ph.events) return;
      const posOf = {};
      subs.forEach((s) => { posOf[s.player_id] = s; });
      const cx = (x) => ox + x * size + size / 2;
      const cy = (y) => oy + y * size + size / 2;
      const fade = 1 - a.frac;               // effects fade over the segment
      g.save();
      for (const ev of ph.events) {
        if (ev.type === "torpedo" || ev.type === "sonar_ping") {
          const isSonar = ev.type === "sonar_ping";
          const path = ev.path || [];
          if (path.length === 0) continue;
          const last = path[path.length - 1];
          g.globalAlpha = 0.4 + 0.5 * fade;
          g.strokeStyle = isSonar ? "#3ce0ff" : "#ffb020";
          g.lineWidth = isSonar ? 2 : 3;
          g.setLineDash(isSonar ? [4, 4] : []);
          g.beginPath();
          g.moveTo(cx(ev.x), cy(ev.y));
          g.lineTo(cx(last.x), cy(last.y));
          g.stroke();
          g.setLineDash([]);
          if (ev.hit) explosion(g, cx(last.x), cy(last.y), size * 0.4, fade,
                                isSonar ? "#3ce0ff" : "#ffb020");
        } else if (ev.type === "explosion") {
          explosion(g, cx(ev.x), cy(ev.y), size * 0.7, fade, "#ff6a30");
        } else if (ev.type === "mine") {
          explosion(g, cx(ev.x), cy(ev.y), size * 0.6, fade, "#e05555");
        } else if (ev.type === "depth_charge_armed") {
          g.globalAlpha = 0.5 + 0.4 * Math.sin(t / 120);
          g.strokeStyle = "#e0a020";
          g.lineWidth = 2;
          g.beginPath();
          g.arc(cx(ev.x), cy(ev.y), size * 0.3, 0, Math.PI * 2);
          g.stroke();
        } else if (ev.type === "ram") {
          const s = posOf[ev.player_id];
          if (s) explosion(g, cx(s.x), cy(s.y), size * 0.35, fade, "#fff2a0");
        } else if (ev.type === "vent") {
          const s = posOf[ev.player_id];
          if (s) {
            g.globalAlpha = 0.4 + 0.5 * fade;
            g.strokeStyle = "#ff8c3c";
            g.lineWidth = 2;
            g.beginPath();
            g.moveTo(cx(s.x), cy(s.y) + size * 0.3);
            g.lineTo(cx(s.x), cy(s.y) - size * 0.3);
            g.moveTo(cx(s.x) - size * 0.15, cy(s.y) - size * 0.1);
            g.lineTo(cx(s.x), cy(s.y) - size * 0.3);
            g.lineTo(cx(s.x) + size * 0.15, cy(s.y) - size * 0.1);
            g.stroke();
          }
        } else if (ev.type === "decoy") {
          // A phantom torpedo streaks out and drops a false contact.
          const s = posOf[ev.player_id];
          g.globalAlpha = 0.4 + 0.5 * fade;
          g.strokeStyle = "#e0607a";
          g.lineWidth = 2;
          g.setLineDash([3, 3]);
          g.beginPath();
          if (s) { g.moveTo(cx(s.x), cy(s.y)); g.lineTo(cx(ev.x), cy(ev.y)); }
          g.stroke();
          g.setLineDash([]);
          g.beginPath();
          g.arc(cx(ev.x), cy(ev.y), size * 0.3 * (1.2 - fade), 0, Math.PI * 2);
          g.stroke();
        } else if (ev.type === "emp_burst") {
          // An expanding electric ring at the source, sparking the target.
          g.globalAlpha = 0.3 + 0.5 * fade;
          g.strokeStyle = "#8ad0ff";
          g.lineWidth = 2;
          g.beginPath();
          g.arc(cx(ev.x), cy(ev.y), size * (0.3 + 0.55 * (1 - fade)),
                0, Math.PI * 2);
          g.stroke();
          const tgt = posOf[ev.target];
          if (tgt) explosion(g, cx(tgt.x), cy(tgt.y), size * 0.4, fade, "#8ad0ff");
        }
      }
      g.restore();
    }

    function explosion(g, x, y, r, fade, color) {
      g.globalAlpha = 0.15 + 0.55 * fade;
      g.fillStyle = color;
      g.beginPath();
      g.arc(x, y, r * (0.6 + 0.6 * (1 - fade)), 0, Math.PI * 2);
      g.fill();
      g.globalAlpha = 0.3 + 0.5 * fade;
      g.strokeStyle = color;
      g.lineWidth = 2;
      g.beginPath();
      g.arc(x, y, r * (0.8 + 0.8 * (1 - fade)), 0, Math.PI * 2);
      g.stroke();
    }

    // --- ghost path preview & phase replay ------------------------------
    const DIR_VEC = { N: [0, -1], E: [1, 0], S: [0, 1], W: [-1, 0] };
    const ROT_L = { N: "W", W: "S", S: "E", E: "N" };
    const ROT_R = { N: "E", E: "S", S: "W", W: "N" };
    const PHASE_MS = 1050;
    // Fraction of each register's window spent moving; the remainder is a
    // brief settle/hold so the step-by-step cadence reads clearly.
    const MOVE_FRACTION = 0.8;

    // Ease-in-out so each register's motion accelerates then settles,
    // giving the replay a deliberate, step-by-step feel.
    function easeInOut(t) {
      return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
    }

    // Map a segment fraction to eased motion progress: move over the first
    // MOVE_FRACTION of the window, then hold at 1 for the settle beat.
    function easeStep(frac) {
      return easeInOut(Math.min(1, frac / MOVE_FRACTION));
    }

    function isWall(x, y) {
      const b = state.board;
      if (!b || !b.grid) return true;
      if (x < 0 || y < 0 || x >= b.width || y >= b.height) return true;
      return ((b.grid[y] || "")[x] || "#") === "#";
    }

    function mySub() {
      return state.subs.find((s) => s.player_id === state.playerId) || null;
    }

    // Header identity: name + a colored dot matching the player's own sub.
    function updateWhoami() {
      const name = el.nameInput.value.trim() ||
        localStorage.getItem(LS_NAME) || "Captain";
      const me = mySub();
      el.whoami.textContent = "";
      if (me && me.color) {
        const dot = document.createElement("span");
        dot.style.cssText =
          "display:inline-block;width:11px;height:11px;border-radius:50%;" +
          `background:${me.color};box-shadow:0 0 6px ${me.color};` +
          "margin-right:6px;vertical-align:middle";
        el.whoami.appendChild(dot);
        el.whoami.appendChild(document.createTextNode(name));
      } else {
        el.whoami.textContent = name;
      }
    }

    // Predict my sub's path this round by applying my program locally.
    // Ignores other subs and currents (walls still block); preview only.
    function predictPath(sub, program) {
      let x = sub.x, y = sub.y, f = sub.facing;
      const pts = [{ x, y, f }];
      for (const kind of program) {
        if (kind === "port_bank") { f = ROT_L[f]; }
        else if (kind === "starboard_bank") { f = ROT_R[f]; }
        else if (MOVE_CARDS[kind]) {
          const steps = MOVE_CARDS[kind];
          let [dx, dy] = DIR_VEC[f];
          if (kind === "reverse") { dx = -dx; dy = -dy; }
          for (let s = 0; s < steps; s++) {
            if (isWall(x + dx, y + dy)) break;
            x += dx; y += dy;
          }
        }
        // dive / surface / torpedo / depth_charge / sonar_ping: no movement
        pts.push({ x, y, f });
      }
      return pts;
    }

    function drawGhostPath(g, ox, oy, size) {
      if (state.locked || state.program.length === 0) return;
      const me = mySub();
      if (!me) return;
      const kinds = state.program.map(kindOfCard).filter(Boolean);
      const pts = predictPath(me, kinds);
      const cx = (p) => ox + p.x * size + size / 2;
      const cy = (p) => oy + p.y * size + size / 2;
      g.save();
      g.strokeStyle = (me.color || "#3cf");
      g.globalAlpha = 0.4;
      g.setLineDash([4, 4]);
      g.lineWidth = 2;
      g.beginPath();
      g.moveTo(cx(pts[0]), cy(pts[0]));
      pts.forEach((p) => g.lineTo(cx(p), cy(p)));
      g.stroke();
      g.setLineDash([]);
      pts.forEach((p, i) => {
        g.globalAlpha = 0.25 + 0.5 * (i / pts.length);
        g.fillStyle = (me.color || "#3cf");
        g.beginPath();
        g.arc(cx(p), cy(p), size * 0.1, 0, Math.PI * 2);
        g.fill();
      });
      // heading arrows show facing at each step, so turns are visible even
      // when the sub stays on the same tile.
      pts.forEach((p, i) => {
        const ang = FACING_ANGLE[p.f] || 0;
        g.save();
        g.translate(cx(p), cy(p));
        g.rotate(ang);
        g.globalAlpha = 0.35 + 0.55 * (i / pts.length);
        g.strokeStyle = (me.color || "#3cf");
        g.lineWidth = 2;
        const a = size * 0.22;
        g.beginPath();
        g.moveTo(-a * 0.6, 0);
        g.lineTo(a * 0.6, 0);
        g.moveTo(a * 0.6, 0);
        g.lineTo(a * 0.2, -a * 0.4);
        g.moveTo(a * 0.6, 0);
        g.lineTo(a * 0.2, a * 0.4);
        g.stroke();
        g.restore();
      });
      g.restore();
    }

    // Build keyframes and start an interpolated replay of the round.
    function startReplay(phases, finalSubs) {
      const colorById = {};
      // Seed from the full roster so sonar contacts that pop in mid-replay
      // still get their owner's colour even when we've never held their sub.
      Object.keys(state.roster).forEach((id) => {
        colorById[id] = state.roster[id].color;
      });
      state.subs.forEach((s) => { colorById[s.player_id] = s.color; });
      (finalSubs || []).forEach((s) => {
        if (s.color) colorById[s.player_id] = s.color;
      });
      const frames = [snapshotSubs(state.subs)]
        .concat(phases.map((ph) => ph.submarines || []));
      state.anim = { frames, phases, finalSubs, colorById, t0: null,
                     seg: 0, frac: 0, lastSfxSeg: -1 };
    }

    // Play the combat SFX for a replay phase, de-duplicating by sound so a
    // phase with several hits doesn't stack into a wall of noise.
    function playPhaseSfx(events) {
      if (!state.soundOn || !events) return;
      const done = {};
      const once = (k, fn) => { if (!done[k]) { done[k] = 1; fn(); } };
      events.forEach((ev) => {
        switch (ev.type) {
          case "torpedo":     once("torpedo", Sfx.torpedo); break;
          case "sonar_ping":  once("sonar", Sfx.sonar); break;
          case "explosion":   once("explosion", Sfx.explosion); break;
          case "mine":        once("mine", Sfx.mine); break;
          case "emp_burst":   once("emp", Sfx.emp); break;
          case "ram":         once("ram", Sfx.hit); break;
          case "hit":         once("hit", Sfx.creak); break;
          case "destroyed":   once("destroyed", Sfx.explosion); break;
          default: break;
        }
      });
    }

    function snapshotSubs(subs) {
      return subs.map((s) => ({
        player_id: s.player_id, x: s.x, y: s.y,
        facing: s.facing, depth: s.depth,
        hull: s.hull, alive: s.alive,
      }));
    }

    function indexById(list) {
      const m = {};
      (list || []).forEach((s) => { m[s.player_id] = s; });
      return m;
    }

    // Interpolated sub positions for the current replay time.
    function animatedSubs(t) {
      const a = state.anim;
      if (a.t0 === null) a.t0 = t;
      const elapsed = t - a.t0;
      const seg = Math.floor(elapsed / PHASE_MS);
      if (seg >= a.frames.length - 1) {
        state.subs = a.finalSubs || state.subs;
        state.anim = null;
        renderGamePlayers({ players: state.subs });
        flushPendingRound();
        return state.subs;
      }
      const frac = (elapsed % PHASE_MS) / PHASE_MS;
      a.seg = seg;
      a.frac = frac;
      if (seg !== a.lastSfxSeg) {
        a.lastSfxSeg = seg;
        playPhaseSfx((a.phases[seg] || {}).events);
      }
      const ef = easeStep(frac);
      const from = indexById(a.frames[seg]);
      const to = indexById(a.frames[seg + 1]);
      const out = [];
      Object.keys(to).forEach((id) => {
        const b = to[id];
        const aa = from[id] || b;
        const half = frac < 0.5 ? aa : b;
        out.push({
          player_id: id,
          x: aa.x + (b.x - aa.x) * ef,
          y: aa.y + (b.y - aa.y) * ef,
          facing: half.facing,
          depth: half.depth,
          hull: half.hull,
          alive: half.alive,
          color: a.colorById[id] || "#3cf",
        });
      });
      return out;
    }

    function tick(t) {
      // If frames stalled (window backgrounded, occluded, or minimized) the
      // browser pauses requestAnimationFrame. Absorb that gap into the replay
      // clock so the animation resumes where it left off instead of jumping to
      // the end and skipping the replay entirely.
      if (lastFrameT !== null && state.anim && state.anim.t0 !== null) {
        const gap = t - lastFrameT;
        if (gap > 300) state.anim.t0 += gap;
      }
      lastFrameT = t;
      if (state.view === "game") {
        renderBoard(t);
        updateTimer();
        updateRegisterHighlight();
        updatePhasePill();
      }
      requestAnimationFrame(tick);
    }

    // While a replay runs, glow the register slot currently being executed.
    function updateRegisterHighlight() {
      const kids = el.slots ? el.slots.children : [];
      const active = state.anim ? state.anim.seg : -1;
      for (let i = 0; i < kids.length; i++) {
        kids[i].classList.toggle("executing", i === active);
      }
    }

    function updateTimer() {
      if (state.timerEndsAt == null) return;
      const ms = Math.max(0, state.timerEndsAt - Date.now());
      const secs = Math.ceil(ms / 1000);
      el.pingTimer.textContent = secs + "s";
      el.pingTimer.classList.toggle("urgent", secs <= 10);
    }

    function badge(cls, text) {
      const b = document.createElement("span");
      b.className = "badge " + cls;
      b.textContent = text;
      return b;
    }

    function myReady() {
      if (!state.lobby) return false;
      const me = (state.lobby.players || [])
        .find((x) => x.player_id === state.playerId);
      return me ? me.ready : false;
    }

    // --- actions --------------------------------------------------------
    el.btnCreate.addEventListener("click", () => {
      persistName();
      send("create_game", { max_players: 4, map_id: el.mapSelect.value });
    });
    el.btnJoin.addEventListener("click", () => {
      persistName();
      const code = el.roomInput.value.trim().toUpperCase();
      if (!code) { el.homeToast.textContent = "Enter a room code."; return; }
      send("join_game", { room_code: code });
    });
    el.btnReady.addEventListener("click", () =>
      send("set_ready", { ready: !myReady() }));
    el.btnAddBot.addEventListener("click", () => send("add_bot", {}));
    el.btnStart.addEventListener("click", () => send("start_game", {}));
    el.btnLeave.addEventListener("click", leaveRoom);
    el.btnLeaveGame.addEventListener("click", leaveRoom);
    el.btnClear.addEventListener("click", () => {
      if (state.locked) return;
      state.program = [];
      renderSlots();
    });
    el.btnLock.addEventListener("click", lockRegisters);
    el.btnSonar.addEventListener("click", toggleSonar);
    el.btnSound.addEventListener("click", toggleSound);
    // Resume the (autoplay-gated) audio context on the first user gesture.
    window.addEventListener("pointerdown", () => Sfx.unlock(), { once: true });

    // --- map hover tooltips --------------------------------------------
    const FEATURE_TIP = {
      "#": { title: "Trench wall", sub: "Solid rock \u2014 impassable." },
      ".": { title: "Open trench", sub: "Clear water to move through." },
      "S": { title: "Spawn point", sub: "Where a submarine starts." },
      "D": { title: "Data node", sub: "Objective \u2014 sitting here collects intel." },
      "X": { title: "Extraction zone", sub: "Escape here with your data to score." },
      "M": { title: "Sea mine", sub: "Detonates on contact \u2014 steer clear or clear it." },
      "V": { title: "Thermal vent", sub: "Forces a sub upward (Deep \u2192 Shallow)." },
    };
    const FACING_NAME = { N: "North", E: "East", S: "South", W: "West" };

    function cellFromEvent(ev) {
      if (!boardMetrics || !state.board) return null;
      const rect = el.canvas.getBoundingClientRect();
      const scaleX = el.canvas.width / rect.width;
